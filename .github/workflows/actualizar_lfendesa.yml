# Workflow de GitHub Actions para la LF Endesa.
# Va en el repo de las estadísticas, en  .github/workflows/actualizar_lfendesa.yml
name: Actualizar estadisticas LF Endesa

on:
  schedule:
    - cron: "37 1-23/3 * * *"
  workflow_dispatch:             # y el botón "Run workflow" a mano

# Las ligas nuevas esperan su turno: nunca escriben en Google a la vez
concurrency:
  group: escritura-hojas-ligas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install requests pandas gspread beautifulsoup4 lxml html5lib google-auth
      - name: Descargar LF Endesa a su hoja
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}   # el mismo secreto de siempre
          GOOGLE_SHEET_ID: "1wCPiSaFF-OPE3rRuSBVlryk1WNFr7ImBUyw1satVqtM"
          FEB_COMPETICION: "4"
          FEB_SLUG_URL: "lfendesa"
          FEB_COMPETICIONES: "U:4"
          FEB_SEASON_START: "2026"
        run: python feb_stats_sync.py
