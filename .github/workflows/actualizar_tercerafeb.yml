# Workflow de GitHub Actions para la Tercera FEB.
# Va en el repo de las estadísticas, en  .github/workflows/actualizar_tercerafeb.yml
name: Actualizar estadisticas Tercera FEB

on:
  schedule:
    - cron: "47 1-23/6 * * *"
  workflow_dispatch:             # y el botón "Run workflow" a mano

# Las ligas nuevas esperan su turno: nunca escriben en Google a la vez
concurrency:
  group: escritura-hojas-ligas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install requests pandas gspread beautifulsoup4 lxml html5lib google-auth
      - name: Descargar Tercera FEB a su hoja
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}   # el mismo secreto de siempre
          GOOGLE_SHEET_ID: "1xmmIVHdraS_H1jZtmgmrGfV4njrFzbkSpf8qgWQ9X8Y"
          FEB_COMPETICION: "3"
          FEB_SLUG_URL: "tercerafeb"
          FEB_COMPETICIONES: "auto"
          FEB_SEASON_START: "2026"
        run: python feb_stats_sync.py
