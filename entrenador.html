<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenador · ScoutFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
  :root{--ink:#1b2432;--soft:#5b6779;--orange:#e0602a;--line:#e5d8c4;--bg:#f8f4ee;--white:#fff;--teal:#2f6f5e;--suave:#f4efe6;--side:#1b2432;--rojo:#e8403a;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;}
  button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--ink);color:#fff;}
  button:disabled{opacity:.45;cursor:default;}
  button.naranja{background:var(--orange);} button.verde{background:var(--teal);} button.rojo{background:var(--rojo);}
  button.gris{background:var(--suave);color:var(--ink);border:1.5px solid var(--line);}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;}
  textarea{min-height:90px;resize:vertical;}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);margin:12px 0 5px;}
  h2,h3{font-family:'Archivo Black',sans-serif;font-weight:400;margin:0;}

  #app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100vh;}
  aside{background:var(--side);color:#dfe5ee;display:flex;flex-direction:column;overflow:auto;}
  .marca{padding:18px 18px 10px;font-family:'Archivo Black',sans-serif;font-size:18px;color:#fff;}
  .marca small{display:block;font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;color:#8fa0b6;margin-top:2px;letter-spacing:.4px;}
  .grupo{padding:10px 10px 0;}
  .grupo h4{margin:8px 10px 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7e8da3;font-weight:800;}
  .grupo button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;color:#dfe5ee;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;}
  .grupo button:hover{background:rgba(255,255,255,.07);}
  .grupo button.on{background:var(--orange);color:#fff;}
  .grupo button .n{margin-left:auto;font-size:11px;opacity:.7;font-weight:700;}
  .pie{margin-top:auto;padding:14px;}
  .pie a{display:block;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);}
  .pie a:hover{background:rgba(255,255,255,.08);}
  main{overflow:auto;padding:22px 26px 60px;min-width:0;}
  .cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .cab h2{font-size:24px;}
  .miga{font-size:13px;color:var(--soft);font-weight:700;}
  .miga a{color:var(--orange);cursor:pointer;text-decoration:none;}
  .miga{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .cab .esp{flex:1;}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .barra input[type=search]{max-width:300px;}
  .aviso-sql{background:#fff3e0;border:1.5px solid #f0b979;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600;}
  .tabla{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
  .tabla .fila{display:grid;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);}
  .tabla .fila:first-child{border-top:0;}
  .tabla .fila.cabt{background:var(--suave);font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--soft);cursor:default;}
  .tabla .fila:not(.cabt){cursor:pointer;} .tabla .fila:not(.cabt):hover{background:#fffaf2;}
  .c-jug{grid-template-columns:minmax(0,2.2fr) 1fr 70px 70px 150px 40px;}
  .c-eje{grid-template-columns:minmax(0,2.2fr) 1.2fr 80px 150px 40px;}
  .c-pla{grid-template-columns:minmax(0,2.2fr) 110px 90px 90px 150px 40px;}
  .c-pb{grid-template-columns:minmax(0,2.2fr) 90px 1fr 100px 70px 150px 40px;}
  .nom{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0;}
  .nom span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ico{font-size:20px;flex:none;}
  .peq{color:var(--soft);font-size:13px;}
  .mas{background:transparent;color:var(--soft);font-size:20px;padding:2px 8px;line-height:1;}
  .mas:hover{background:var(--suave);}
  .vacio{padding:34px 16px;text-align:center;color:var(--soft);font-weight:600;}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100vh;}
    aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center;}
    .marca{display:none;} .grupo{display:flex;padding:8px 6px;gap:4px;} .grupo h4{display:none;}
    .grupo button{white-space:nowrap;padding:9px 12px;} .pie{margin:0;padding:8px;} .pie a{white-space:nowrap;padding:9px 12px;}
    main{padding:16px 14px 60px;}
    .c-jug,.c-eje,.c-pla,.c-pb{grid-template-columns:minmax(0,1fr) 40px;}
    .c-jug>:nth-child(n+2):not(:last-child),.c-eje>:nth-child(n+2):not(:last-child),.c-pla>:nth-child(n+2):not(:last-child),.c-pb>:nth-child(n+2):not(:last-child){display:none;}
  }

  /* menu contextual y ventanas */
  #menuPop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:180px;display:none;}
  #menuPop button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);padding:9px 12px;font-size:13px;border-radius:8px;}
  #menuPop button:hover{background:var(--suave);} #menuPop button.pel{color:#d12b3a;}
  .velo{position:fixed;inset:0;background:rgba(15,23,35,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:14px;}
  .velo.ver{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:94vh;overflow:auto;padding:18px;}
  .modal.ancho{max-width:760px;}
  .modal h3{font-size:18px;margin-bottom:6px;}
  .modal .pie-m{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;} @media (max-width:560px){.dos{grid-template-columns:1fr;}}
  .lista-sel{border:1.5px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;margin-top:6px;}
  .lista-sel label.it{display:flex;gap:10px;align-items:center;margin:0;padding:9px 12px;border-top:1px solid var(--line);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .lista-sel label.it:first-child{border-top:0;}
  .lista-sel input[type=checkbox]{width:auto;}
  #editorMarco,#visorMarco{position:fixed;inset:0;z-index:250;background:var(--bg);display:none;flex-direction:column;}
  #editorMarco.ver,#visorMarco.ver{display:flex;}
  #editorMarco iframe,#visorMarco iframe{flex:1;border:0;width:100%;}
  #visorMarco .cabv{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;font-weight:700;}
  #aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2432;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;}
  #aviso.ver{opacity:1;}

  /* tarjetas (jugadas de un playbook, archivos) */
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .tarj{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .tarj .vista{background:var(--suave);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
  .tarj .vista img,.tarj .vista video{width:100%;height:100%;object-fit:cover;}
  .tarj .vista audio{width:92%;}
  .tarj .cu{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
  .tarj .cu b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tarj .acc{display:flex;gap:6px;flex-wrap:wrap;}
  .tarj .acc button{padding:6px 10px;font-size:12px;}
  #soltar{border:2.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--soft);font-weight:700;margin-bottom:16px;background:#fff;}
  #soltar.sobre{border-color:var(--orange);background:#fff4ec;}

  /* plan */
  .ejp{display:grid;grid-template-columns:34px minmax(0,1.6fr) 86px minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#fff;}
  .ejp:first-child{border-top:0;}
  .ejp .nn{font-family:'Archivo Black',sans-serif;color:var(--orange);font-size:17px;}
  .ejp .h{font-size:12px;color:var(--soft);font-weight:700;}
  @media (max-width:800px){.ejp{grid-template-columns:30px 1fr auto;} .ejp>:nth-child(3),.ejp>:nth-child(4){grid-column:2/4;}}
  .totales{display:flex;gap:18px;flex-wrap:wrap;font-weight:800;margin:12px 0;}
  .totales span b{color:var(--orange);}


  /* carpetas verdes, etiquetas, filtros */
  .c-jug{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 90px 60px 90px 150px 36px !important;}
  .c-eje{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 130px 80px 150px 36px !important;}
  .c-pla{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 100px 80px 80px 150px 36px !important;}
  .ck{display:flex;align-items:center;} .ck input{width:auto;margin:0;opacity:0;cursor:pointer;} .fila:hover .ck input,.fila.sel .ck input,.tj:hover .ck input,.tj.sel .ck input{opacity:1;}
  .fila.sel,.tj.sel{background:#e9f7f2 !important;}
  svg.carp{flex:none;display:block;}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;margin:0 5px 4px 0;white-space:nowrap;}
  .tag b{cursor:pointer;margin-left:3px;} a.tag{cursor:pointer;text-decoration:none;} a.tag.on{outline:2.5px solid var(--ink);}
  .tags{display:flex;flex-wrap:wrap;min-width:0;overflow:hidden;max-height:50px;}
  .tgbox{border:1.5px solid var(--line);border-radius:10px;min-height:42px;padding:8px 8px 4px;margin-bottom:8px;}
  .activos{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:-4px 0 12px;} .tag.act{cursor:pointer;background:var(--suave);color:var(--ink);border:1.5px solid var(--line);}
  .limpiar{color:var(--orange);font-weight:800;cursor:pointer;font-size:12.5px;margin-left:6px;}
  .barra .esp{flex:1;} .barra input[type=search]{max-width:280px;}
  .bola{background:var(--orange);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:3px;}
  .split{display:inline-flex;} .split button:first-child{border-radius:10px 0 0 10px;} .split button:last-child{border-radius:0 10px 10px 0;border-left:1.5px solid rgba(255,255,255,.4);padding:9px 11px;}
  .vistas{display:inline-flex;} .vistas button{border-radius:0;padding:9px 11px;} .vistas button:first-child{border-radius:10px 0 0 10px;} .vistas button:last-child{border-radius:0 10px 10px 0;border-left:0;} .vistas button.on{background:var(--ink);color:#fff;}
  .selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#e9f7f2;border:1.5px solid #9ad8c4;border-radius:12px;padding:8px 12px;margin-bottom:12px;} .selbar .esp{flex:1;}
  .fila.sobre,.tj.sobre,.miga a.sobre{background:#d6f3e8 !important;outline:2.5px dashed #15a37f;outline-offset:-3px;border-radius:8px;}
  .arrastrando{opacity:.4;}
  .tj{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;} .tj:hover{border-color:#15a37f;}
  .tj .vista{background:var(--suave);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:44px;}
  .tj .cu{padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;} .tj .nom .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tj .ck{position:absolute;top:8px;left:8px;background:#fff;border-radius:6px;padding:3px;}
  #cajon{position:fixed;inset:0;background:rgba(15,23,35,.45);z-index:260;display:none;justify-content:flex-end;} #cajon.ver{display:flex;}
  .cajon-c{background:#fff;width:100%;max-width:360px;height:100%;padding:18px;display:flex;flex-direction:column;overflow:auto;}
  .nube{display:flex;flex-wrap:wrap;gap:2px;}
  /* menu lateral plegable */
  .marca{display:flex;align-items:flex-start;gap:6px;} .marca .tt{flex:1;} .colbtn{background:rgba(255,255,255,.1);padding:4px 9px;font-size:14px;border-radius:8px;}
  .grupo button .i{width:22px;text-align:center;flex:none;}
  #app{transition:grid-template-columns .15s;}
  #app.col{grid-template-columns:64px minmax(0,1fr);} #app.col .tx,#app.col .n,#app.col .grupo h4,#app.col .marca small,#app.col .marca .tt span{display:none;} #app.col .marca{padding:14px 8px;flex-direction:column;align-items:center;} #app.col .grupo button{justify-content:center;padding:10px 4px;} #app.col .pie a{padding:10px 0;}
  @media (max-width:900px){.colbtn{display:none;} #app.col{grid-template-columns:1fr;} #app.col .tx{display:inline;}
    .fila.c-jug,.fila.c-eje,.fila.c-pla{grid-template-columns:26px minmax(0,1fr) 36px !important;} .fila.c-jug>:nth-child(n+3):not(:last-child),.fila.c-eje>:nth-child(n+3):not(:last-child),.fila.c-pla>:nth-child(n+3):not(:last-child){display:none;}}
  #hojaImp{display:none;}
  @media print{
    #app,#menuPop,.velo,#editorMarco,#visorMarco,#aviso{display:none !important;}
    body{background:#fff;}
    #hojaImp{display:block;padding:10mm;font-size:12pt;}
    #hojaImp h1{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22pt;margin:0 0 4px;}
    #hojaImp table{width:100%;border-collapse:collapse;margin-top:10px;}
    #hojaImp td,#hojaImp th{border:1px solid #888;padding:6px 8px;text-align:left;vertical-align:top;font-size:11pt;}
    #hojaImp th{background:#eee;}
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="marca"><div class="tt"><span>🏀 Entrenador</span><small>ScoutFlow · pizarra y planificación</small></div><button class="colbtn" id="btnCol" title="Plegar menú">«</button></div>
    <div class="grupo"><h4>Jugadas</h4>
      <button data-s="jugadas"><span class="i">🏀</span><span class="tx">Jugadas</span><span class="n" id="n-jugadas"></span></button>
      <button data-s="playbooks"><span class="i">📘</span><span class="tx">Playbooks</span><span class="n" id="n-playbooks"></span></button>
    </div>
    <div class="grupo"><h4>Planificación</h4>
      <button data-s="ejercicios"><span class="i">🎯</span><span class="tx">Ejercicios</span><span class="n" id="n-ejercicios"></span></button>
      <button data-s="planes"><span class="i">📋</span><span class="tx">Planes de entrenamiento</span><span class="n" id="n-planes"></span></button>
    </div>
    <div class="grupo"><h4>Archivos</h4>
      <button data-s="video"><span class="i">🎬</span><span class="tx">Vídeos</span><span class="n" id="n-video"></span></button>
      <button data-s="imagen"><span class="i">🖼️</span><span class="tx">Imágenes</span><span class="n" id="n-imagen"></span></button>
      <button data-s="audio"><span class="i">🎧</span><span class="tx">Audio</span><span class="n" id="n-audio"></span></button>
    </div>
    <div class="pie"><a href="index.html"><span class="i">←</span><span class="tx"> Volver a estadísticas</span></a></div>
  </aside>
  <main id="main"><p class="vacio">Cargando…</p></main>
</div>

<div id="menuPop"></div>
<div id="cajon"></div>
<div id="aviso"></div>

<!-- ventana generica (formularios) -->
<div class="velo" id="velo"><div class="modal" id="modal"></div></div>

<!-- editor de jugadas (pizarra) y visor -->
<div id="editorMarco"><iframe id="marcoEd" title="Editor de jugadas"></iframe></div>
<div id="visorMarco"><div class="cabv"><span id="tituloVisor">Jugada</span><button class="gris" id="cerrarVisor">Cerrar ✕</button></div><iframe id="marcoVisor" title="Jugada"></iframe></div>

<div id="hojaImp"></div>

<script>
const SB = { url: "https://tizmzblksovdqqnlxpli.supabase.co", anon: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpem16Ymxrc292ZHFxbmx4cGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDQxMjMsImV4cCI6MjEwNjUyMDEyM30.eXScUQYTkSxtnNb4TO-FJUsdKpnkTk5z-1QLPjxHAGo" };
const VERSION = "2026-10-09";
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const clonar = (o) => JSON.parse(JSON.stringify(o));
const idNuevo = (p) => (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const fechaTxt = (iso) => { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }) + " " + d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); };
const solofecha = (f) => { if (!f) return "—"; const d = new Date(f + "T12:00:00"); return isNaN(d) ? f : d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }); };
const tamTxt = (b) => !b ? "" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
let temporal;
function aviso(t) { const a = $("aviso"); a.textContent = t; a.classList.add("ver"); clearTimeout(temporal); temporal = setTimeout(() => a.classList.remove("ver"), 2600); }

const nube = window.supabase ? window.supabase.createClient(SB.url, SB.anon) : null;
const D = { jugadas: [], playbooks: [], ejercicios: [], planes: [], archivos: [], carpetas: [] };
let puedeEscribir = true, faltaSql = "", seccion = "jugadas", carpeta = "", busqueda = "", vistaDetalle = null;
const CATEGORIAS = ["Calentamiento", "Técnica individual", "Tiro", "Defensa", "Ataque", "Juego reducido", "Físico", "Estrategia", "Otro"];
const SECCIONES = { jugadas: "Jugadas", playbooks: "Playbooks", ejercicios: "Ejercicios", planes: "Planes de entrenamiento", video: "Vídeos", imagen: "Imágenes", audio: "Audio" };

/* ------------ datos ------------ */
async function leer(tabla, orden) {
  const { data, error } = await nube.from(tabla).select("*").order(orden || "actualizada", { ascending: false });
  if (error) { if (!faltaSql) faltaSql = tabla + ": " + error.message; return []; }
  return data || [];
}
async function cargarTodo() {
  faltaSql = "";
  const [j, pb, ej, pl, ar, ca] = await Promise.all([leer("jugadas"), leer("playbooks"), leer("ejercicios"), leer("planes"), leer("archivos", "creada"), leer("carpetas", "creada")]);
  D.jugadas = j; D.playbooks = pb; D.ejercicios = ej; D.planes = pl; D.archivos = ar; D.carpetas = ca;
  contadores();
}
function contadores() {
  const c = { jugadas: D.jugadas.length, playbooks: D.playbooks.length, ejercicios: D.ejercicios.length, planes: D.planes.length, video: D.archivos.filter(a => a.tipo === "video").length, imagen: D.archivos.filter(a => a.tipo === "imagen").length, audio: D.archivos.filter(a => a.tipo === "audio").length };
  Object.keys(c).forEach(k => { const e = $("n-" + k); if (e) e.textContent = c[k] || ""; });
}
async function guardarFila(tabla, fila) {
  const { error } = await nube.from(tabla).upsert(Object.assign({}, fila, tabla === "archivos" || tabla === "carpetas" ? {} : { actualizada: new Date().toISOString() }));
  if (error) { aviso("No se pudo guardar: " + error.message); return false; }
  return true;
}
async function borrarFila(tabla, id) { const { error } = await nube.from(tabla).delete().eq("id", id); if (error) { aviso("No se pudo borrar: " + error.message); return false; } return true; }

/* ------------ navegacion ------------ */
function ir(s, c) { seccion = s; carpeta = c || ""; busqueda = ""; filtroTags = []; filtroTipo = ""; seleccion = new Set(); vistaDetalle = null; try { history.replaceState(null, "", "#" + s); } catch (e) { /* nada */ } pintar(); }
function pintar() {
  document.querySelectorAll("aside .grupo button").forEach(b => b.classList.toggle("on", b.dataset.s === seccion));

  const aviso0 = faltaSql ? `<div class="aviso-sql">⚠️ Falta preparar la base de datos: ejecuta <b>${/jugadas/.test(faltaSql) && !/playbooks|ejercicios|planes|archivos|carpetas/.test(faltaSql) ? "jugadas.sql" : "entrenador.sql"}</b> en Supabase › SQL Editor. <span class="peq">(${esc(faltaSql)})</span></div>` : "";

/* ------------ menu emergente y ventana ------------ */
const menu = $("menuPop");
function abrirMenu(ev, opciones) {

  menu.style.display = "block";
  const r = ev.currentTarget.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(r.right - 190, innerWidth - 200)) + "px";
  menu.style.top = Math.min(r.bottom + 4, innerHeight - menu.offsetHeight - 8) + "px";
}
document.addEventListener("click", () => { menu.style.display = "none"; });
function ventana(html, ancho) { const m = $("modal"); m.className = "modal" + (ancho ? " ancho" : ""); m.innerHTML = html; $("velo").classList.add("ver"); return m; }
function cerrarVentana() { $("velo").classList.remove("ver"); $("modal").innerHTML = ""; }
$("velo").addEventListener("mousedown", (e) => { if (e.target === $("velo")) cerrarVentana(); });
function preguntar(titulo, etiqueta, valor, ok) {

const botonNuevo = (txt, id) => puedeEscribir ? `<button class="naranja" id="${id}">${txt}</button>` : "";

/* ------------ etiquetas ------------ */
const tagsDe = (x) => (x && x.data && Array.isArray(x.data.tags)) ? x.data.tags : [];
const todasTags = (tipo) => [...new Set(D[tipo].flatMap(tagsDe))].sort((a, b) => a.localeCompare(b, "es"));
function estiloTag(t) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360; return `background:hsl(${h} 70% 91%);color:hsl(${h} 55% 26%);`; }
const chipsTags = (x) => tagsDe(x).map(t => `<span class="tag" style="${estiloTag(t)}">${esc(t)}</span>`).join("");
async function fijarTags(tipo, x, tags) { const d = clonar(x.data || {}); d.tags = tags; const { error } = await nube.from(TABLA_DE[tipo]).update({ data: d }).eq("id", x.id); if (error) aviso("No se pudo guardar: " + error.message); }
function editarTags(tipo, lista) {
  let comunes = lista.length === 1 ? tagsDe(lista[0]).slice() : [];
  const sug = todasTags(tipo);
  const m = ventana(`<h3>🏷 Etiquetas${lista.length > 1 ? " (" + lista.length + " elementos)" : ""}</h3>${lista.length > 1 ? '<p class="peq" style="margin:4px 0 0;">Las etiquetas que añadas se suman a las que ya tienen.</p>' : ""}<label>Escribe y pulsa Intro</label><div id="tgBox" class="tgbox"></div><input id="tgIn" placeholder="Ej: zona, transición, 4 out" list="tgDl"><datalist id="tgDl">${sug.map(t => `<option value="${esc(t)}">`).join("")}</datalist>${sug.length ? `<div class="peq" style="margin-top:8px;">Usadas: ${sug.map(t => `<a class="tag sug" data-t="${esc(t)}" style="${estiloTag(t)}">${esc(t)}</a>`).join("")}</div>` : ""}<div class="pie-m"><button class="gris" id="tgX">Cancelar</button><button class="naranja" id="tgG">Guardar</button></div>`);
  const pint = () => { $("tgBox").innerHTML = comunes.map(t => `<span class="tag" style="${estiloTag(t)}">${esc(t)} <b data-q="${esc(t)}">×</b></span>`).join("") || '<span class="peq">Sin etiquetas</span>'; $("tgBox").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { comunes = comunes.filter(t => t !== b.dataset.q); pint(); }); };
  const sumar = (t) => { t = t.trim().replace(/,/g, ""); if (t && !comunes.includes(t)) comunes.push(t); pint(); };
  pint(); $("tgIn").focus();
  $("tgIn").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); sumar($("tgIn").value); $("tgIn").value = ""; } });

  };
}

function carpetasDe(tipo) {
  const set = new Map();
  D.carpetas.filter(c => c.tipo === tipo).forEach(c => set.set(c.nombre, { nombre: c.nombre, n: 0, ult: c.creada }));
  D[tipo].forEach(x => { if (x.carpeta) { const e = set.get(x.carpeta) || { nombre: x.carpeta, n: 0, ult: "" }; e.n++; if (!e.ult || x.actualizada > e.ult) e.ult = x.actualizada; set.set(x.carpeta, e); } });

}
const textoDe = (tipo, x) => (x.nombre + " " + (x.carpeta || "") + " " + ((x.data && (x.data.categoria || x.data.descripcion)) || x.tipo || "") + " " + tagsDe(x).join(" ")).toLowerCase();
const valorTipo = (tipo, x) => tipo === "jugadas" ? (x.tipo || "") : tipo === "ejercicios" ? ((x.data && x.data.categoria) || "") : "";
function filtrar(tipo, plano) {
  const q = busqueda.toLowerCase();
  return D[tipo].filter(x => (plano || (x.carpeta || "") === carpeta) && (!q || textoDe(tipo, x).includes(q)) && filtroTags.every(t => tagsDe(x).includes(t)) && (!filtroTipo || valorTipo(tipo, x) === filtroTipo));
}
const hayFiltro = () => !!(busqueda || filtroTags.length || filtroTipo);
function ordenarLista(arr, campoFecha, campoNombre) {
  const f = {
    recientes: (a, b) => String(b[campoFecha] || "").localeCompare(String(a[campoFecha] || "")),
    antiguas: (a, b) => String(a[campoFecha] || "").localeCompare(String(b[campoFecha] || "")),
    az: (a, b) => String(a[campoNombre] || "").localeCompare(String(b[campoNombre] || ""), "es"),
    za: (a, b) => String(b[campoNombre] || "").localeCompare(String(a[campoNombre] || ""), "es")

  return arr.slice().sort(f);
}

/* soltar elementos arrastrados sobre una carpeta (o sobre la raiz) */
function soltarEn(el, tipo, nombre) {
  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("sobre"); });
  el.addEventListener("dragleave", () => el.classList.remove("sobre"));
  el.addEventListener("drop", async (e) => {
    e.preventDefault(); el.classList.remove("sobre");
    let ids = []; try { ids = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (x) { return; }
    const lista = D[tipo].filter(x => ids.includes(x.id) && (x.carpeta || "") !== nombre); if (!lista.length) return;
    for (const x of lista) await ponerCarpeta(tipo, x, nombre);
    seleccion.clear(); aviso(lista.length + (lista.length > 1 ? " elementos movidos" : " elemento movido") + (nombre ? " a «" + nombre + "»" : " a la raíz"));
    await cargarTodo(); pintar();
  });
}

  v.querySelectorAll(".ejp").forEach(el => {
    const i = Number(el.dataset.i);
    el.querySelectorAll("[data-f]").forEach(inp => inp.addEventListener(inp.dataset.f === "min" ? "change" : "input", () => { lista[i][inp.dataset.f] = inp.dataset.f === "min" ? (Number(inp.value) || 0) : inp.value; if (inp.dataset.f === "min") { volcar(); pintar(); } }));
    el.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { volcar(); if (b.dataset.m === "x") lista.splice(i, 1); else if (b.dataset.m === "up" && i > 0) [lista[i - 1], lista[i]] = [lista[i], lista[i - 1]]; else if (b.dataset.m === "dn" && i < lista.length - 1) [lista[i + 1], lista[i]] = [lista[i], lista[i + 1]]; pintar(); }));
  });
  if ($("plAdd")) $("plAdd").onclick = () => { volcar(); elegirEjercicio((id) => { const ej = D.ejercicios.find(y => y.id === id); lista.push({ id, min: (ej && ej.data && ej.data.minutos) || 10, notas: "" }); pintar(); }); };
  if ($("plG")) $("plG").onclick = async () => { volcar(); if (!p.nombre) { aviso("Ponle un nombre al plan."); return; } const fila = { id: p.id, nombre: p.nombre, carpeta: p.carpeta, fecha: p.fecha, data: d }; if (await guardarFila("planes", fila)) { aviso("Plan guardado ✓"); p.nuevo = false; if (p.carpeta && !D.carpetas.some(c => c.tipo === "planes" && c.nombre === p.carpeta)) await guardarFila("carpetas", { tipo: "planes", nombre: p.carpeta }); await cargarTodo(); pintarPlan(v); } };
  $("plPrint").onclick = () => { volcar(); imprimirPlan(p, hm); };
}
function elegirEjercicio(ok) {
  let q = "";
  const m = ventana(`<h3>Añadir ejercicio</h3><input type="search" id="elQ" placeholder="Buscar en tu biblioteca…"><div class="lista-sel" id="elL" style="max-height:380px;"></div><div class="pie-m"><button class="gris" id="elX">Cerrar</button></div>`);
  const pin = () => { const l = D.ejercicios.filter(e => !q || (e.nombre + " " + (e.carpeta || "") + " " + ((e.data && e.data.categoria) || "")).toLowerCase().includes(q)); $("elL").innerHTML = l.length ? l.map(e => `<label class="it" data-id="${esc(e.id)}"><span style="flex:1;">🎯 ${esc(e.nombre)}</span><span class="peq">${esc((e.data && e.data.categoria) || "")} ${e.data && e.data.minutos ? "· " + e.data.minutos + " min" : ""}</span></label>`).join("") : '<div class="vacio">Aún no tienes ejercicios. Crea alguno en «Ejercicios».</div>'; $("elL").querySelectorAll("[data-id]").forEach(el => el.addEventListener("click", () => { cerrarVentana(); ok(el.dataset.id); })); };
  pin(); $("elQ").addEventListener("input", (e) => { q = e.target.value.toLowerCase(); pin(); }); $("elX").onclick = cerrarVentana;
}
function imprimirPlan(p, hm) {
  const d = p.data; let acum = 0;
  const filas = d.ejercicios.map((e, i) => { const ej = D.ejercicios.find(y => y.id === e.id), ini = hm(acum); acum += Number(e.min) || 0; const dd = (ej && ej.data) || {};
    return `<tr><td>${i + 1}</td><td>${ini}–${hm(acum)}<br>${e.min || 0} min</td><td><b>${esc(ej ? ej.nombre : "")}</b><br>${esc(dd.categoria || "")}${dd.materiales ? "<br><i>Material: " + esc(dd.materiales) + "</i>" : ""}</td><td>${esc(dd.descripcion || "").replace(/\n/g, "<br>")}${e.notas ? "<br><b>Notas:</b> " + esc(e.notas) : ""}</td></tr>`; }).join("");
  $("hojaImp").innerHTML = `<h1>${esc(p.nombre || "Plan de entrenamiento")}</h1><div>${solofecha(p.fecha)} · ${acum} min · ${d.ejercicios.length} ejercicios</div>${d.notas ? `<p>${esc(d.notas).replace(/\n/g, "<br>")}</p>` : ""}<table><tr><th>#</th><th>Horario</th><th>Ejercicio</th><th>Descripción</th></tr>${filas}</table>`;
  window.print();
}

/* ------------ archivos: videos, imagenes, audio ------------ */
const pubUrl = (a) => nube.storage.from("entrenador").getPublicUrl(a.ruta).data.publicUrl;
const ACEPTA = { video: "video/*", imagen: "image/*", audio: "audio/*" }, ICO_AR = { video: "🎬", imagen: "🖼️", audio: "🎧" };
function pintarArchivos(v, tipo) {
  const q = busqueda.toLowerCase(), lista = D.archivos.filter(a => a.tipo === tipo && (!q || a.nombre.toLowerCase().includes(q)));
  v.innerHTML = `<div class="cab"><h2>${SECCIONES[tipo]}</h2><span class="esp"></span>${puedeEscribir ? `<button class="naranja" id="bSubir">⬆ Subir ${tipo === "audio" ? "audios" : tipo === "video" ? "vídeos" : "imágenes"}</button>` : ""}</div>
    ${puedeEscribir ? `<div id="soltar">Arrastra aquí tus archivos o pulsa «Subir». <span class="peq">(máx. 50 MB por archivo)</span></div><input type="file" id="fArch" accept="${ACEPTA[tipo]}" multiple style="display:none;">` : ""}
    <div class="barra"><input type="search" id="bq" placeholder="Buscar…" value="${esc(busqueda)}"></div>
    <div class="rejilla">${lista.map(a => { const u = pubUrl(a), vista = tipo === "imagen" ? `<img src="${esc(u)}" loading="lazy" alt="">` : tipo === "video" ? `<video src="${esc(u)}#t=0.5" preload="metadata" controls></video>` : `<audio src="${esc(u)}" controls preload="none"></audio>`;
      return `<div class="tarj" data-id="${esc(a.id)}"><div class="vista">${vista}</div><div class="cu"><b title="${esc(a.nombre)}">${esc(a.nombre)}</b><span class="peq">${tamTxt(a.tamano)} · ${fechaTxt(a.creada)}</span><div class="acc"><button class="gris" data-a="copiar">🔗 Copiar enlace</button><button class="gris" data-a="abrir">↗ Abrir</button>${puedeEscribir ? '<button class="gris" data-a="ren">✏️</button><button class="gris" data-a="del" style="color:#c0392b;">🗑</button>' : ""}</div></div></div>`; }).join("") || `<p class="vacio" style="grid-column:1/-1;">${q ? "Nada coincide con la búsqueda." : "Aún no has subido nada aquí."}</p>`}</div>`;
  $("bq").addEventListener("input", (e) => { busqueda = e.target.value; const p = e.target.selectionStart; pintarArchivos(v, tipo); const n = $("bq"); n.focus(); n.setSelectionRange(p, p); });
  if (puedeEscribir) {
    const fi = $("fArch"), zona = $("soltar");
    $("bSubir").onclick = () => fi.click(); zona.onclick = () => fi.click();
    fi.onchange = () => subir([...fi.files], tipo);
    ["dragover", "dragenter"].forEach(ev => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add("sobre"); }));
    ["dragleave", "drop"].forEach(ev => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.remove("sobre"); }));
    zona.addEventListener("drop", (e) => subir([...e.dataTransfer.files].filter(f => f.type.startsWith(tipo === "imagen" ? "image/" : tipo + "/")), tipo));
  }
  v.querySelectorAll(".tarj").forEach(el => {
    const a = D.archivos.find(y => y.id === el.dataset.id);
    el.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", async () => {
      if (b.dataset.a === "copiar") { try { await navigator.clipboard.writeText(pubUrl(a)); aviso("Enlace copiado ✓"); } catch (e) { prompt("Copia el enlace:", pubUrl(a)); } }
      else if (b.dataset.a === "abrir") window.open(pubUrl(a), "_blank", "noopener");
      else if (b.dataset.a === "ren") preguntar("Renombrar", "Nombre", a.nombre, async (n) => { if (await guardarFila("archivos", Object.assign({}, a, { nombre: n }))) { await cargarTodo(); pintar(); } });
      else if (b.dataset.a === "del" && confirm("¿Borrar «" + a.nombre + "»? Los enlaces que lo usen dejarán de funcionar.")) { await nube.storage.from("entrenador").remove([a.ruta]); if (await borrarFila("archivos", a.id)) { await cargarTodo(); pintar(); } }
    }));
  });
}
async function subir(files, tipo) {
  if (!files.length) return;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 50 * 1024 * 1024) { aviso("«" + f.name + "» pesa más de 50 MB: no se sube."); continue; }
    aviso("Subiendo " + (i + 1) + " de " + files.length + "…");
    const id = idNuevo("a"), limpio = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_"), ruta = tipo + "/" + id + "-" + limpio;
    const { error } = await nube.storage.from("entrenador").upload(ruta, f, { contentType: f.type || undefined, upsert: false });
    if (error) { aviso("Error al subir «" + f.name + "»: " + error.message); continue; }
    if (await guardarFila("archivos", { id, nombre: f.name, tipo, ruta, mime: f.type, tamano: f.size })) ok++;
  }
  if (ok) aviso(ok + " archivo(s) subido(s) ✓");
  await cargarTodo(); pintar();
}

/* ------------ arranque ------------ */
function pantalla(msg, enlace) { $("main").innerHTML = `<div class="vacio" style="padding-top:60px;font-size:16px;">${msg}${enlace ? `<p><a href="index.html" style="color:var(--orange);font-weight:800;">${enlace}</a></p>` : ""}</div>`; }
async function iniciar() {
  try { if (localStorage.getItem("ent_col") === "1") $("app").classList.add("col"); } catch (e) { /* nada */ }
  $("btnCol").addEventListener("click", () => { const c = $("app").classList.toggle("col"); $("btnCol").textContent = c ? "»" : "«"; try { localStorage.setItem("ent_col", c ? "1" : "0"); } catch (e) { /* nada */ } });
  $("cajon").addEventListener("mousedown", (e) => { if (e.target === $("cajon")) $("cajon").classList.remove("ver"); });
  document.querySelectorAll("aside .grupo button").forEach(b => b.addEventListener("click", () => ir(b.dataset.s)));
  if (!nube) { pantalla("No se pudo cargar la conexión con la nube. Revisa tu internet."); return; }
  const { data } = await nube.auth.getSession();
  if (!data || !data.session) { pantalla("Entra con tu cuenta en la app de estadísticas para usar el Entrenador.", "← Ir a la app"); return; }
  try {
    const r = await nube.rpc("es_entrenador");
    if (r && r.data === false) { pantalla("Esta sección es solo para entrenadores."); return; }
  } catch (e) { /* si falla la comprobacion, las reglas de la base de datos protegen igualmente */ }
  try { const r = await nube.rpc("puede_escribir"); if (r && !r.error && r.data === false) puedeEscribir = false; } catch (e) { /* sin roles: se puede escribir */ }
  await cargarTodo();
  const h = (location.hash || "").replace("#", ""); if (SECCIONES[h]) seccion = h;
  if (!puedeEscribir) aviso("Modo lectura: solo el propietario puede editar.");
  pintar();
}
iniciar();
</script>
