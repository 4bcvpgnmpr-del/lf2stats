<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrenador · ScoutFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<style>
  :root{--ink:#1b2432;--soft:#5b6779;--orange:#e0602a;--line:#e5d8c4;--bg:#f8f4ee;--white:#fff;--teal:#2f6f5e;--suave:#f4efe6;--side:#1b2432;--rojo:#e8403a;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;}
  button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--ink);color:#fff;}
  button:disabled{opacity:.45;cursor:default;}
  button.naranja{background:var(--orange);} button.verde{background:var(--teal);} button.rojo{background:var(--rojo);}
  button.gris{background:var(--suave);color:var(--ink);border:1.5px solid var(--line);}
  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;}
  textarea{min-height:90px;resize:vertical;}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);margin:12px 0 5px;}
  h2,h3{font-family:'Archivo Black',sans-serif;font-weight:400;margin:0;}

  #app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100vh;}
  aside{background:var(--side);color:#dfe5ee;display:flex;flex-direction:column;overflow:auto;}
  .marca{padding:18px 18px 10px;font-family:'Archivo Black',sans-serif;font-size:18px;color:#fff;}
  .marca small{display:block;font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;color:#8fa0b6;margin-top:2px;letter-spacing:.4px;}
  .grupo{padding:10px 10px 0;}
  .grupo h4{margin:8px 10px 6px;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#7e8da3;font-weight:800;}
  .grupo button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:transparent;color:#dfe5ee;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;}
  .grupo button:hover{background:rgba(255,255,255,.07);}
  .grupo button.on{background:var(--orange);color:#fff;}
  .grupo button .n{margin-left:auto;font-size:11px;opacity:.7;font-weight:700;}
  .pie{margin-top:auto;padding:14px;}
  .pie a{display:block;text-align:center;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);}
  .pie a:hover{background:rgba(255,255,255,.08);}
  main{overflow:auto;padding:22px 26px 60px;min-width:0;}
  .cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .cab h2{font-size:24px;}
  .miga{font-size:13px;color:var(--soft);font-weight:700;}
  .miga a{color:var(--orange);cursor:pointer;text-decoration:none;}
  .miga{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .cab .esp{flex:1;}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .barra input[type=search]{max-width:300px;}
  .aviso-sql{background:#fff3e0;border:1.5px solid #f0b979;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600;}
  .tabla{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;}
  .tabla .fila{display:grid;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);}
  .tabla .fila:first-child{border-top:0;}
  .tabla .fila.cabt{background:var(--suave);font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--soft);cursor:default;}
  .tabla .fila:not(.cabt){cursor:pointer;} .tabla .fila:not(.cabt):hover{background:#fffaf2;}
  .c-jug{grid-template-columns:minmax(0,2.2fr) 1fr 70px 70px 150px 40px;}
  .c-eje{grid-template-columns:minmax(0,2.2fr) 1.2fr 80px 150px 40px;}
  .c-pla{grid-template-columns:minmax(0,2.2fr) 110px 90px 90px 150px 40px;}
  .c-pb{grid-template-columns:minmax(0,2.2fr) 90px 1fr 100px 70px 150px 40px;}
  .nom{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0;}
  .nom span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ico{font-size:20px;flex:none;}
  .peq{color:var(--soft);font-size:13px;}
  .mas{background:transparent;color:var(--soft);font-size:20px;padding:2px 8px;line-height:1;}
  .mas:hover{background:var(--suave);}
  .vacio{padding:34px 16px;text-align:center;color:var(--soft);font-weight:600;}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100vh;}
    aside{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center;}
    .marca{display:none;} .grupo{display:flex;padding:8px 6px;gap:4px;} .grupo h4{display:none;}
    .grupo button{white-space:nowrap;padding:9px 12px;} .pie{margin:0;padding:8px;} .pie a{white-space:nowrap;padding:9px 12px;}
    main{padding:16px 14px 60px;}
  }

  /* menu contextual y ventanas */
  #menuPop{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:180px;display:none;}
  #menuPop button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);padding:9px 12px;font-size:13px;border-radius:8px;}
  #menuPop button:hover{background:var(--suave);} #menuPop button.pel{color:#d12b3a;}
  .velo{position:fixed;inset:0;background:rgba(15,23,35,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:14px;}
  .velo.ver{display:flex;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:94vh;overflow:auto;padding:18px;}
  .modal.ancho{max-width:760px;}
  .modal h3{font-size:18px;margin-bottom:6px;}
  .modal .pie-m{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;} @media (max-width:560px){.dos{grid-template-columns:1fr;}}
  .lista-sel{border:1.5px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;margin-top:6px;}
  .lista-sel label.it{display:flex;gap:10px;align-items:center;margin:0;padding:9px 12px;border-top:1px solid var(--line);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .lista-sel label.it:first-child{border-top:0;}
  .lista-sel input[type=checkbox],.lista-sel input[type=radio]{width:auto;}
  .lista-sel label.it span{display:flex;align-items:center;gap:8px;}
  #editorMarco,#visorMarco{position:fixed;inset:0;z-index:250;background:var(--bg);display:none;flex-direction:column;}
  #editorMarco.ver,#visorMarco.ver{display:flex;}
  #editorMarco iframe,#visorMarco iframe{flex:1;border:0;width:100%;}
  #visorMarco .cabv{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:#fff;font-weight:700;}
  #aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2432;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;}
  #aviso.ver{opacity:1;}

  /* tarjetas (jugadas de un playbook, archivos) */
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .tarj{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .tarj .vista{background:var(--suave);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
  .tarj .vista img,.tarj .vista video{width:100%;height:100%;object-fit:cover;}
  .tarj .vista audio{width:92%;}
  .tarj .cu{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
  .tarj .cu b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tarj .acc{display:flex;gap:6px;flex-wrap:wrap;}
  .tarj .acc button{padding:6px 10px;font-size:12px;}
  #soltar{border:2.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--soft);font-weight:700;margin-bottom:16px;background:#fff;}
  #soltar.sobre{border-color:var(--orange);background:#fff4ec;}

  /* plan */
  .ejp{display:grid;grid-template-columns:34px minmax(0,1.6fr) 86px minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#fff;}
  .ejp:first-child{border-top:0;}
  .ejp .nn{font-family:'Archivo Black',sans-serif;color:var(--orange);font-size:17px;}
  .ejp .h{font-size:12px;color:var(--soft);font-weight:700;}
  @media (max-width:800px){.ejp{grid-template-columns:30px 1fr auto;} .ejp>:nth-child(3),.ejp>:nth-child(4){grid-column:2/4;}}
  .totales{display:flex;gap:18px;flex-wrap:wrap;font-weight:800;margin:12px 0;}
  .totales span b{color:var(--orange);}


  /* carpetas verdes, etiquetas, filtros */
  .c-jug{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 90px 60px 90px 150px 36px !important;}
  .c-eje{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 130px 80px 150px 36px !important;}
  .c-pla{grid-template-columns:26px minmax(0,2fr) minmax(0,1.4fr) 100px 80px 80px 150px 36px !important;}
  .ck{display:flex;align-items:center;} .ck input{width:auto;margin:0;opacity:0;cursor:pointer;} .fila:hover .ck input,.fila.sel .ck input,.tj:hover .ck input,.tj.sel .ck input{opacity:1;}
  .fila.sel,.tj.sel{background:#e9f7f2 !important;}
  svg.carp{flex:none;display:block;}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;margin:0 5px 4px 0;white-space:nowrap;}
  .tag b{cursor:pointer;margin-left:3px;} a.tag{cursor:pointer;text-decoration:none;} a.tag.on{outline:2.5px solid var(--ink);}
  .tags{display:flex;flex-wrap:wrap;min-width:0;overflow:hidden;max-height:50px;}
  .tgbox{border:1.5px solid var(--line);border-radius:10px;min-height:42px;padding:8px 8px 4px;margin-bottom:8px;}
  .activos{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:-4px 0 12px;} .tag.act{cursor:pointer;background:var(--suave);color:var(--ink);border:1.5px solid var(--line);}
  .limpiar{color:var(--orange);font-weight:800;cursor:pointer;font-size:12.5px;margin-left:6px;}
  .barra .esp{flex:1;} .barra input[type=search]{max-width:280px;}
  .bola{background:var(--orange);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;margin-left:3px;}
  .split{display:inline-flex;} .split button:first-child{border-radius:10px 0 0 10px;} .split button:last-child{border-radius:0 10px 10px 0;border-left:1.5px solid rgba(255,255,255,.4);padding:9px 11px;}
  .vistas{display:inline-flex;} .vistas button{border-radius:0;padding:9px 11px;} .vistas button:first-child{border-radius:10px 0 0 10px;} .vistas button:last-child{border-radius:0 10px 10px 0;border-left:0;} .vistas button.on{background:var(--ink);color:#fff;}
  .selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#e9f7f2;border:1.5px solid #9ad8c4;border-radius:12px;padding:8px 12px;margin-bottom:12px;} .selbar .esp{flex:1;}
  .fila.sobre,.tj.sobre,.miga a.sobre{background:#d6f3e8 !important;outline:2.5px dashed #15a37f;outline-offset:-3px;border-radius:8px;}
  .arrastrando{opacity:.4;}
  .tj{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;} .tj:hover{border-color:#15a37f;}
  .mini-l{flex:none;width:84px;height:78px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;} .mini-l svg{width:100%;height:100%;display:block;}
  .fila.c-jug:not(.cabt){padding-top:7px;padding-bottom:7px;}
  .tj .vista.mini{aspect-ratio:4/3;background:#fff;font-size:44px;} .tj .vista.mini svg{width:100%;height:100%;display:block;}
  .tj .vista{background:var(--suave);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:44px;}
  .tj .cu{padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;} .tj .nom .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tj .ck{position:absolute;top:8px;left:8px;background:#fff;border-radius:6px;padding:3px;}
  #cajon{position:fixed;inset:0;background:rgba(15,23,35,.45);z-index:260;display:none;justify-content:flex-end;} #cajon.ver{display:flex;}
  .cajon-c{background:#fff;width:100%;max-width:360px;height:100%;padding:18px;display:flex;flex-direction:column;overflow:auto;}
  .nube{display:flex;flex-wrap:wrap;gap:2px;}
  /* menu lateral plegable */
  .marca{display:flex;align-items:flex-start;gap:6px;} .marca .tt{flex:1;} .colbtn{background:rgba(255,255,255,.1);padding:4px 9px;font-size:14px;border-radius:8px;}
  .grupo button .i{width:22px;text-align:center;flex:none;}
  #app{transition:grid-template-columns .15s;}
  #app.col{grid-template-columns:64px minmax(0,1fr);} #app.col .tx,#app.col .n,#app.col .grupo h4,#app.col .marca small,#app.col .marca .tt span{display:none;} #app.col .marca{padding:14px 8px;flex-direction:column;align-items:center;} #app.col .grupo button{justify-content:center;padding:10px 4px;} #app.col .pie a{padding:10px 0;}
  @media (max-width:900px){.colbtn{display:none;} #app.col{grid-template-columns:1fr;} #app.col .tx{display:inline;}
    .fila.c-jug,.fila.c-eje,.fila.c-pla{grid-template-columns:26px minmax(0,1fr) 36px !important;} .fila.c-jug>:nth-child(n+3):not(:last-child),.fila.c-eje>:nth-child(n+3):not(:last-child),.fila.c-pla>:nth-child(n+3):not(:last-child){display:none;}}

  @media (max-width:900px){
    #app{grid-template-columns:1fr !important;grid-template-rows:auto minmax(0,1fr);}
    aside .marca,aside .colbtn{display:none !important;}
    aside{position:sticky;top:0;z-index:20;} aside .grupo button{padding:10px 12px;} aside .grupo button .i{width:auto;}
    aside .grupo .n{margin-left:4px;}
    .cab h2{font-size:20px;} .barra input[type=search]{max-width:none;flex:1 1 100%;}
    .mini-l{width:56px;height:52px;}
    .tgbox,.cajon-c{max-width:100%;}
    .modal{padding:14px;} .modal.ancho{max-width:100%;}
    .rejilla{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
    .fila.c-pb{grid-template-columns:minmax(0,1fr) 36px !important;} .fila.c-pb>:nth-child(n+2):not(:last-child){display:none;}
  }
  @media (max-width:520px){ .cab .split button{font-size:12.5px;padding:9px 10px;} main{padding:14px 12px 60px !important;} }

  #planEd{--pg:#3f9c86;--pgd:#34836f;--pbg:#f5f6f8;--pln:#e3e6ea;position:fixed;inset:0;z-index:150;background:var(--pbg);display:none;flex-direction:column;color:#1f2933;}
  #planEd.ver{display:flex;}
  #planEd button{font-weight:600;}
  .pe-top{display:flex;align-items:center;gap:8px;padding:0 18px 0 8px;height:70px;background:#fff;border-bottom:1px solid var(--pln);flex:none;}
  .pe-l{flex:1;display:flex;align-items:center;gap:6px;min-width:0;} .pe-c{display:flex;align-items:center;gap:6px;} .pe-r{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-end;}
  .pe-ic{background:transparent;color:#4a5560;border:0;padding:8px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;line-height:0;}
  .pe-ic:hover{background:#eef1f3;} .pe-ic:disabled{opacity:.35;cursor:default;}
  .pe-tit{flex:1;min-width:0;max-width:420px;font-weight:700;font-size:16px;border:0;background:transparent;padding:8px 6px;border-radius:8px;color:#1f2933;}
  .pe-tit:hover,.pe-tit:focus{background:#f0f2f4;outline:0;}
  .pe-tabs{display:inline-flex;gap:4px;} .pe-tabs button{background:transparent;color:#4a5560;padding:11px 20px;border-radius:9px;font-size:15px;font-weight:700;}
  .pe-tabs button.on{background:var(--pg);color:#fff;} .pe-tabs button:not(.on):hover{background:#eef1f3;}
  .pe-sep{width:1px;height:34px;background:var(--pln);margin:0 10px;}
  .pe-save{display:inline-flex;} .pe-save button{background:var(--pg);color:#fff;padding:12px 20px;font-size:15px;border-radius:9px 0 0 9px;} .pe-save button+button{border-radius:0 9px 9px 0;border-left:1px solid rgba(255,255,255,.35);padding:12px 12px;}
  .pe-save button:hover{background:var(--pgd);}
  .pe-cuerpo{flex:1;overflow:auto;padding:26px 24px 90px 60px;width:100%;max-width:1620px;margin:0 auto;}
  .pe-h{display:flex;align-items:baseline;gap:12px;margin:6px 0 26px 34px;} .pe-h h2{font-size:21px;font-weight:700;margin:0;} .pe-h span{color:#5b6670;font-size:16px;}
  .pe-lista{display:flex;flex-direction:column;gap:10px;}
  .pe-fila{display:flex;align-items:center;gap:10px;} .pe-fila.arr{opacity:.4;} .dst-a{box-shadow:0 -3px 0 var(--pg);} .dst-b{box-shadow:0 3px 0 var(--pg);}
  .pe-asa{cursor:grab;color:#6b7680;width:24px;flex:none;display:flex;justify-content:center;user-select:none;touch-action:none;line-height:0;}
  .pe-tarj{flex:1;min-width:0;display:flex;align-items:stretch;background:#fff;border:1px solid var(--pln);border-radius:14px;min-height:62px;overflow:hidden;}
  .pe-tarj>div{display:flex;align-items:center;min-width:0;}
  .pe-c1{flex:0 0 180px;justify-content:center;border-right:1px solid var(--pln);}
  .pe-min{background:transparent;color:#1f2933;font-size:15px;padding:10px 16px;border-radius:8px;width:100%;height:100%;font-weight:600;} .pe-min:hover{background:#f4f6f7;}
  .pe-c2{flex:1.1;border-right:1px solid var(--pln);padding-right:10px;} .pe-c3{flex:1.5;}
  .pe-tarj input{border:0;background:transparent;border-radius:0;padding:10px 18px;font-size:15px;height:100%;color:#1f2933;} .pe-tarj input:focus{outline:0;background:#fafbfb;}
  .pe-tarj input::placeholder,#planEd input::placeholder,#planEd textarea::placeholder{color:#8b949c;}
  .pe-tarj input[data-f=notas]{padding-left:68px;}
  .pe-vinc{background:transparent;color:var(--pg);padding:6px;border-radius:8px;line-height:0;flex:none;} .pe-vinc:hover{background:#eaf5f2;}
  .pe-c4{flex:0 0 auto;gap:2px;padding:0 10px;border-left:1px solid var(--pln);}
  .pe-c4 button{background:transparent;color:#2b3640;padding:7px;border-radius:8px;line-height:0;} .pe-c4 button:hover{background:#eef1f3;}
  .pe-sec{flex:1;display:flex;align-items:center;gap:6px;min-height:44px;margin-top:8px;}
  .pe-sec input{flex:1;text-align:center;text-transform:uppercase;font-weight:800;letter-spacing:.8px;font-size:15px;border:0;background:transparent;} .pe-sec input:focus{background:#fff;outline:0;border-radius:8px;}
  .pe-sec button{background:transparent;color:#2b3640;padding:7px;line-height:0;border-radius:8px;} .pe-sec button:hover{background:#eef1f3;}
  .pe-add{margin:16px 0 0 34px;}
  .pe-addb{display:inline-flex;box-shadow:0 6px 14px rgba(63,156,134,.35);border-radius:10px;} .pe-addb button{background:var(--pg);color:#fff;padding:12px 18px;font-size:15px;border-radius:10px 0 0 10px;display:inline-flex;gap:8px;align-items:center;}
  .pe-addb button+button{border-radius:0 10px 10px 0;border-left:1px solid rgba(0,0,0,.25);padding:12px 16px;} .pe-addb button:hover{background:var(--pgd);}
  .pe-card{background:#fff;border:1px solid var(--pln);border-radius:14px;padding:22px;max-width:860px;margin:0 auto;}
  #planEd .pe-card label{font-size:12px;color:#5b6670;}
  .pv-sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--pln);font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-size:13px;} .pv-sec span{color:var(--pg);}
  .pv-seg{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--pln);} .pv-seg:first-of-type{border-top:0;}
  .pv-m{min-width:52px;font-weight:700;} .pv-m small{font-size:12px;font-weight:500;color:#5b6670;margin-left:2px;}
  .pv-n{margin-top:3px;} .pv-d{margin-top:3px;font-size:13px;color:#5b6670;}
  #planEd .naranja,#planEd .gris.pe-ref{background:var(--pg);}
  .pt{width:210px;padding:6px;} .pt-f{display:flex;gap:6px;margin:8px 0;} .pt-f input{text-align:center;font-weight:800;} .pt-r{display:flex;gap:6px;} .pt button{width:auto;display:inline-block;text-align:center;}
  .pt-r button{flex:1;padding:7px 0;} .pt-f button{padding:6px 14px;}
  .np{display:flex;flex-direction:column;gap:10px;margin-top:10px;} .np button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;font-weight:600;text-align:left;font-size:14px;}
  @media (max-width:900px){ .pe-top{flex-wrap:wrap;height:auto;padding:8px;} .pe-l{flex:1 1 100%;order:1;} .pe-c{order:3;flex:1 1 auto;justify-content:center;} .pe-r{order:2;flex:0 0 auto;} .pe-tabs button{padding:9px 12px;font-size:14px;}
    .pe-cuerpo{padding:16px 10px 90px;} .pe-h,.pe-add{margin-left:4px;} .pe-asa{width:16px;} .pe-tarj{flex-wrap:wrap;} .pe-c1{flex:0 0 90px;} .pe-c2{flex:1 1 calc(100% - 90px);border-right:0;} .pe-c3{flex:1 1 100%;border-top:1px solid var(--pln);} .pe-c4{margin-left:auto;border-left:0;} .pe-tarj input[data-f=notas]{padding-left:18px;} .pe-sep{display:none;} }
  #hojaImp{display:none;}

    body{background:#fff;}
    #hojaImp{display:block;padding:10mm;font-size:12pt;}
    #hojaImp h1{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22pt;margin:0 0 4px;}

  /* ===== tema claro (como The Hoops Geek) ===== */
  :root{--ink:#2b3640;--soft:#5b6670;--orange:#3f9c86;--line:#e3e6ea;--bg:#f5f6f8;--teal:#3f9c86;--suave:#f1f3f5;--side:#fff;}
  body{font-size:15px;}
  h2,h3{font-family:'Archivo',sans-serif;font-weight:700;}
  button{font-weight:600;}
  button.naranja:hover{background:#34836f;}
  #app{grid-template-columns:272px minmax(0,1fr);}
  aside{background:#fff;color:#4a5560;border-right:1px dashed #d4d9de;padding:18px 14px 14px;position:relative;}
  .marca{padding:0 4px 14px;display:flex;align-items:center;justify-content:space-between;}
  .marca .logo{line-height:0;}
  .colbtn{background:#fff !important;color:#4a5560 !important;border:1px solid #e3e6ea !important;border-radius:999px !important;width:34px;height:34px;padding:0 !important;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .perfil{display:flex;align-items:center;gap:12px;background:#f1f3f5;border-radius:14px;padding:16px 14px;margin:0 0 14px;}
  .perfil .av{width:42px;height:42px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #e3e6ea;flex:none;}
  .perfil b{display:block;font-size:16px;color:#2b3640;} .perfil small{display:block;color:#5b6670;font-size:14px;}
  .grupo{padding:6px 0 4px;}
  .grupo h4{margin:14px 10px 8px;font-size:13.5px;letter-spacing:.3px;text-transform:uppercase;color:#2b3640;font-weight:800;}
  .grupo button{color:#4a5560;padding:12px 12px;font-size:16px;font-weight:500;gap:14px;border-radius:12px;}
  .grupo button .i{display:inline-flex;line-height:0;color:#5b6670;}
  .grupo button:hover{background:#f4f6f7;}
  .grupo button.on{background:#e9f4f1;color:#2f8a74;font-weight:600;} .grupo button.on .i{color:#2f8a74;}
  .grupo button .n{color:#8b949c;}
  .pie a{color:#4a5560;border:1px solid #e3e6ea;font-weight:600;} .pie a:hover{background:#f4f6f7;}
  main{padding:44px 56px 80px;}
  .cab{margin-bottom:26px;gap:14px;}
  .cab h2{font-size:36px;font-weight:700;color:#2b3640;letter-spacing:-.3px;}
  .miga a{color:var(--orange);font-weight:600;}
  .split button.naranja{padding:0 26px;height:56px;font-size:18px;font-weight:600;border-radius:12px 0 0 12px;} .split button.naranja+button{border-radius:0 12px 12px 0;padding:0 18px;}
  .split{box-shadow:0 6px 14px rgba(63,156,134,.28);border-radius:12px;}
  .barra{margin-bottom:26px;gap:12px;}
  .barra input[type=search]{max-width:420px;height:52px;border:1px solid #d9dee3;border-radius:10px;padding:0 16px;font-size:17px;}
  .barra button.gris,.barra .vista-t button{height:52px;background:#fff;border:1px solid #d9dee3;border-radius:10px;color:#2b3640;font-size:16px;padding:0 18px;font-weight:500;}
  .tabla{background:transparent;border:0;border-radius:0;overflow:visible;}
  .tabla .fila{padding:18px 24px;border-top:0;border-bottom:1px solid #e3e6ea;gap:14px;font-size:16px;}
  .tabla .fila.cabt{background:#f1f3f5;border-bottom:1px solid #e3e6ea;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:#2b3640;border-radius:4px 4px 0 0;padding:20px 24px;}
  .tabla .fila:not(.cabt):hover{background:#fff;}
  .tabla .fila .nom{font-weight:600;font-size:17px;gap:18px;}
  .tabla .fila .peq{font-size:16px;color:#2b3640;}
  .tabla .fila:not(.cabt) .mas{color:#2b3640;font-size:24px;}
  .tabla .fila .carp,.carp{filter:none;} .carp path{fill:#3f9c86;}
  .tabla .fila.c-jug:not(.cabt),.tabla .fila.c-eje:not(.cabt),.tabla .fila.c-pla:not(.cabt){padding-top:14px;padding-bottom:14px;}
  .modal{border-radius:16px;} .modal h3{font-size:20px;}
  input,select,textarea{border:1px solid #d9dee3;}
  @media (max-width:900px){ aside{border-right:0;border-bottom:1px dashed #d4d9de;padding:6px;} .perfil,.marca .logo{display:none;} .grupo h4{display:none;} .grupo button{font-size:14px;padding:9px 12px;} main{padding:18px 14px 70px;} .cab h2{font-size:26px;} .tabla .fila,.tabla .fila.cabt{padding:12px 12px;font-size:14px;} .tabla .fila .nom{font-size:15px;} .split button.naranja{height:46px;font-size:15px;padding:0 16px;} .barra input[type=search]{height:44px;font-size:15px;} .barra button.gris{height:44px;font-size:14px;} }

  .marca .logo{display:flex;align-items:center;gap:10px;} .marca .logo img{height:46px;width:auto;display:block;}
  .wm{font-family:'Archivo Black',sans-serif;font-style:italic;font-size:19px;color:#2b3640;letter-spacing:-.3px;} .wm b{color:#ff6a00;font-weight:400;}
  .perfil{cursor:pointer;} .perfil:hover{background:#eceff1;} .perfil .av{overflow:hidden;} .perfil .av img{width:100%;height:100%;object-fit:contain;}
  .perfil.img .av{background:transparent;border:0;border-radius:8px;width:48px;height:48px;}
  .perfil .tt{min-width:0;} .perfil b,.perfil small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #app.col .wm{display:none;} #app.col .perfil .tt{display:none;} #app.col .perfil{padding:10px 6px;justify-content:center;}
  .esc-prev{display:flex;align-items:center;gap:14px;margin:8px 0 4px;} .esc-prev .box{width:84px;height:84px;border:1px dashed #cfd5db;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#f8f9fa;overflow:hidden;font-size:34px;} .esc-prev .box img{width:100%;height:100%;object-fit:contain;}

  .marca .logo{background:#000;border-radius:16px;padding:6px;overflow:hidden;flex:1;margin-right:10px;display:block;line-height:0;} .marca .logo img{height:auto;width:100%;display:block;border-radius:10px;} .marca .logo .li{display:none;width:44px;margin:0 auto;}
  .marca .wm{display:none;}
  #app.col .marca .lf{display:none;} #app.col .marca .li{display:block;} #app.col .marca{flex-direction:column;gap:8px;} #app.col .marca .logo{margin:0;}
  @media (max-width:900px){ .marca .logo{display:none !important;} }
</style>

/* miniaturas de jugadas: un iframe oculto de la pizarra dibuja el primer paso de cada una */

      if (ev.data.miniaturasListas) {

async function moverCarpeta(tipo, de, a) {
  const filas = new Set(D.carpetas.filter(c => c.tipo === tipo && enRama(c.nombre, de)).map(c => c.nombre));
  rutasCarpetas(tipo).filter(c => enRama(c.nombre, de)).forEach(c => filas.add(c.nombre));

/* mueve la carpeta `ruta` dentro de `destino` ("" = raiz) con las comprobaciones */

  await moverCarpeta(tipo, ruta, nuevo);
  if (carpeta && enRama(carpeta, ruta)) carpeta = nuevo + carpeta.slice(ruta.length);

    aviso("Subiendo " + (i + 1) + " de " + files.length + "…");
    const id = idNuevo("a"), limpio = f.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_"), ruta = tipo + "/" + id + "-" + limpio;
    const { error } = await nube.storage.from("entrenador").upload(ruta, f, { contentType: f.type || undefined, upsert: false });
    if (error) { aviso("Error al subir «" + f.name + "»: " + error.message); continue; }
    if (await guardarFila("archivos", { id, nombre: f.name, tipo, ruta, mime: f.type, tamano: f.size })) ok++;
  }
  if (ok) aviso(ok + " archivo(s) subido(s) ✓");
  await cargarTodo(); pintar();
}


/* ------------ mi equipo: escudo, nombre y temporada ------------ */
const temporadaActual = () => { const d = new Date(), y = d.getFullYear(), m = d.getMonth(); const a = m >= 7 ? y : y - 1; return a + "/" + String(a + 1).slice(2); };
const equipoDe = () => { const r = D.archivos.find(a => a.id === "_equipo"); let o = {}; try { o = JSON.parse((r && r.nombre) || "{}"); } catch (e) { /* nada */ } return { equipo: o.equipo || "", temporada: o.temporada || "", ruta: (r && r.ruta) || "" }; };
function pintarPerfil() {
  const q = equipoDe(), p = $("perfil"); if (!p || !nube) return;
  const url = q.ruta ? nube.storage.from("entrenador").getPublicUrl(q.ruta).data.publicUrl : "";
  $("perfilAv").innerHTML = url ? `<img src="${esc(url)}" alt="Escudo">` : "🏀"; p.classList.toggle("img", !!url);
  $("perfilEq").textContent = q.equipo || "Mi equipo"; $("perfilTe").textContent = q.temporada ? "Temporada " + q.temporada : (puedeEscribir ? "Añade tu escudo" : "");
}
function formEquipo() {
  if (!puedeEscribir) return;
  const q = equipoDe(); let archivo = null, quitar = false;
  const url0 = q.ruta ? nube.storage.from("entrenador").getPublicUrl(q.ruta).data.publicUrl : "";
  ventana(`<h3>Mi equipo</h3><p class="peq" style="margin:0 0 6px;">El escudo y el nombre del equipo que entrenas esta temporada.</p>
    <label>Escudo</label><div class="esc-prev"><div class="box" id="eqBox">${url0 ? `<img src="${esc(url0)}" alt="">` : "🏀"}</div><div><button class="gris" id="eqElegir">Elegir imagen…</button> ${url0 ? '<button class="gris" id="eqQuitar">Quitar</button>' : ""}<input type="file" id="eqFile" accept="image/*" style="display:none;"></div></div>
    <label>Equipo</label><input id="eqN" value="${esc(q.equipo)}" placeholder="Ej: Alevín A">
    <label>Temporada</label><input id="eqT" value="${esc(q.temporada || temporadaActual())}" placeholder="2026/27">
    <div class="pie-m"><button class="gris" id="eqX">Cancelar</button><button class="naranja" id="eqG">Guardar</button></div>`);
  $("eqElegir").onclick = () => $("eqFile").click();
  $("eqFile").onchange = () => { const f = $("eqFile").files[0]; if (!f) return; if (f.size > 5 * 1024 * 1024) { aviso("La imagen pesa más de 5 MB."); return; } archivo = f; quitar = false; const r = new FileReader(); r.onload = () => { $("eqBox").innerHTML = `<img src="${r.result}" alt="">`; }; r.readAsDataURL(f); };
  if ($("eqQuitar")) $("eqQuitar").onclick = () => { quitar = true; archivo = null; $("eqBox").textContent = "🏀"; };
  $("eqX").onclick = cerrarVentana;
  $("eqG").onclick = async () => {
    let ruta = q.ruta;
    if (archivo) {
      const limpio = archivo.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_"), nueva = "escudo/" + Date.now() + "-" + limpio;
      const { error } = await nube.storage.from("entrenador").upload(nueva, archivo, { contentType: archivo.type || undefined, upsert: false });
      if (error) { aviso("No se pudo subir el escudo: " + error.message); return; }
      if (ruta) await nube.storage.from("entrenador").remove([ruta]);
      ruta = nueva;
    } else if (quitar && ruta) { await nube.storage.from("entrenador").remove([ruta]); ruta = ""; }
    const ok = await guardarFila("archivos", { id: "_equipo", nombre: JSON.stringify({ equipo: $("eqN").value.trim(), temporada: $("eqT").value.trim() }), tipo: "ajustes", ruta: ruta || "", mime: "", tamano: 0 });
    if (ok) { cerrarVentana(); aviso("Equipo guardado ✓"); await cargarTodo(); pintar(); }
  };
}
$("perfil").addEventListener("click", formEquipo);

/* ------------ arranque ------------ */
function pantalla(msg, enlace) { $("main").innerHTML = `<div class="vacio" style="padding-top:60px;font-size:16px;">${msg}${enlace ? `<p><a href="index.html" style="color:var(--orange);font-weight:800;">${enlace}</a></p>` : ""}</div>`; }
async function iniciar() {
  try { if (localStorage.getItem("ent_col") === "1") $("app").classList.add("col"); } catch (e) { /* nada */ }
  $("btnCol").addEventListener("click", () => { const c = $("app").classList.toggle("col"); $("btnCol").textContent = c ? "»" : "«"; try { localStorage.setItem("ent_col", c ? "1" : "0"); } catch (e) { /* nada */ } });
  $("cajon").addEventListener("mousedown", (e) => { if (e.target === $("cajon")) $("cajon").classList.remove("ver"); });
  document.querySelectorAll("aside .grupo button").forEach(b => b.addEventListener("click", () => ir(b.dataset.s)));
  if (!nube) { pantalla("No se pudo cargar la conexión con la nube. Revisa tu internet."); return; }
  const { data } = await nube.auth.getSession();
  if (!data || !data.session) { pantalla("Entra con tu cuenta en la app de estadísticas para usar el Entrenador.", "← Ir a la app"); return; }
  try {
    const r = await nube.rpc("es_entrenador");
    if (r && r.data === false) { pantalla("Esta sección es solo para entrenadores."); return; }
  } catch (e) { /* si falla la comprobacion, las reglas de la base de datos protegen igualmente */ }
  try { const r = await nube.rpc("puede_escribir"); if (r && !r.error && r.data === false) puedeEscribir = false; } catch (e) { /* sin roles: se puede escribir */ }
  await cargarTodo();
  const h = (location.hash || "").replace("#", ""); if (SECCIONES[h]) seccion = h;
  if (!puedeEscribir) aviso("Modo lectura: solo el propietario puede editar.");
  pintar();
}
iniciar();
</script>
