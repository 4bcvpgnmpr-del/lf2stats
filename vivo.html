<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ScoutFlow · Test en directo</title>
<link rel="icon" href="sf-192.png"><meta name="theme-color" content="#1a1030">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
  :root{--fondo:#1a1030;--fondo2:#2a1a4a;--txt:#fff;--suave:#c9bde6;--nar:#ff7a1a;
        --c0:#e21b3c;--c1:#1368ce;--c2:#d89e00;--c3:#26890c;--c4:#864cbf;--c5:#0aa3a3;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{font-family:"Montserrat",-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,#3b2470,var(--fondo));color:var(--txt);overflow-x:hidden;}
  button{font:inherit;cursor:pointer;border:0;}
  .pant{min-height:100vh;display:flex;flex-direction:column;}
  .centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;gap:16px;}
  .logo{font-weight:900;letter-spacing:.02em;font-size:20px;display:flex;align-items:center;gap:8px;justify-content:center;} .logo img{width:30px;height:30px;border-radius:7px;}
  .caja{background:#fff;color:#222;border-radius:16px;padding:18px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px #0006;}
  .caja input{font:inherit;font-size:22px;font-weight:800;text-align:center;padding:14px;border:2px solid #ddd;border-radius:10px;width:100%;}
  .btn{background:#333;color:#fff;font-weight:900;font-size:20px;padding:14px 22px;border-radius:12px;box-shadow:0 4px 0 #0005;} .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005;}
  .btn.nar{background:var(--nar);} .btn.claro{background:#fff;color:#222;} .btn:disabled{opacity:.5;}
  .peq{color:var(--suave);font-size:14px;} .err{color:#ffb3b3;font-weight:700;min-height:1.2em;}
  .codigo{font-size:clamp(56px,11vw,140px);font-weight:900;letter-spacing:.12em;line-height:1;background:#fff;color:#1a1030;border-radius:18px;padding:10px 30px;}
  .jugs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px;}
  .jugs span{background:#ffffff1f;padding:8px 16px;border-radius:999px;font-weight:800;font-size:clamp(15px,1.6vw,22px);animation:entra .3s;}
  @keyframes entra{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .barra-top{display:flex;align-items:center;gap:12px;padding:12px 18px;font-weight:800;} .barra-top .esp{flex:1;}
  .preg{background:#fff;color:#111;font-size:clamp(22px,3.4vw,46px);font-weight:900;padding:18px 26px;border-radius:14px;margin:6px 18px;text-align:center;line-height:1.2;}
  .medio{flex:1;display:flex;align-items:center;justify-content:space-between;padding:10px 30px;gap:20px;}
  .reloj{width:clamp(80px,10vw,140px);height:clamp(80px,10vw,140px);border-radius:50%;background:var(--c4);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,4.5vw,64px);font-weight:900;}
  .resp-n{text-align:center;font-weight:900;font-size:clamp(28px,3.5vw,54px);} .resp-n small{display:block;font-size:16px;color:var(--suave);}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px;}
  .op{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:12px;color:#fff;font-weight:900;font-size:clamp(18px,2.4vw,34px);text-align:left;min-height:clamp(70px,11vh,130px);box-shadow:inset 0 -6px 0 #0003;}
  .op i{font-style:normal;font-size:1.3em;flex:none;width:1.2em;text-align:center;}
  .op.mal{opacity:.3;} .op.bien{outline:6px solid #fff;}
  .c0{background:var(--c0);} .c1{background:var(--c1);} .c2{background:var(--c2);} .c3{background:var(--c3);} .c4{background:var(--c4);} .c5{background:var(--c5);}
  .graf{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,30px);height:28vh;padding:0 20px;margin:10px 0 16px;}
  .ops.res .op{min-height:clamp(54px,8vh,90px);font-size:clamp(16px,2vw,26px);}
  .graf div{width:clamp(50px,9vw,130px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-weight:900;font-size:clamp(18px,2.2vw,30px);}
  .graf b{display:block;width:100%;border-radius:8px 8px 0 0;min-height:8px;}
  .rank{width:min(760px,94vw);display:flex;flex-direction:column;gap:8px;}
  .rank div{display:flex;align-items:center;gap:14px;background:#fff;color:#1a1030;border-radius:10px;padding:12px 18px;font-weight:900;font-size:clamp(18px,2.2vw,28px);}
  .rank div span{flex:1;text-align:left;} .rank div small{color:#888;font-size:.7em;}
  .podio{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:20px;}
  .podio div{width:clamp(100px,16vw,220px);background:var(--nar);border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-weight:900;font-size:clamp(16px,2vw,26px);}
  .podio div b{font-size:1.6em;} .podio .p1{height:44vh;background:#f5b000;} .podio .p2{height:32vh;background:#b9c3cf;color:#1a1030;} .podio .p3{height:24vh;background:#cd7f32;}
  /* móvil del jugador */
  .mops{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
  .mops button{border-radius:14px;color:#fff;font-size:clamp(44px,14vw,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -8px 0 #0003;}
  .mops button small{font-size:15px;font-weight:800;padding:0 8px;line-height:1.2;max-height:3.6em;overflow:hidden;}
  .gran{font-size:clamp(30px,9vw,60px);font-weight:900;} .ok{background:#26890c !important;} .ko{background:#c0213a !important;}
  .tabla{width:min(900px,96vw);border-collapse:collapse;background:#fff;color:#222;border-radius:12px;overflow:hidden;font-size:15px;}
  .tabla th,.tabla td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;} .tabla th{background:#f3f0fa;}
  .lista-t{display:flex;flex-direction:column;gap:8px;width:min(560px,100%);} .lista-t button{background:#fff;color:#1a1030;text-align:left;padding:14px 16px;border-radius:12px;font-weight:800;font-size:17px;} .lista-t small{display:block;color:#777;font-weight:600;font-size:13px;}
  @media (max-width:700px){ .ops{grid-template-columns:1fr;} .medio{padding:6px 14px;} }
  .fila-t{display:flex;gap:8px;align-items:stretch;} .fila-t .jugar{flex:1;} .fila-t .jugar:disabled{opacity:.55;}
  .mini{background:#ffffff26;color:#fff;border-radius:10px;padding:0 12px;font-size:18px;} .mini:hover{background:#ffffff40;}
  .ed{width:min(760px,100%);margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;}
  .ed-cab{display:grid;grid-template-columns:1fr 180px;gap:10px;} .ed label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13px;color:var(--suave);}
  .ed input[type=text],.ed #edTit,.ed select,.ed textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:0;background:#fff;color:#1a1030;width:100%;}
  .ed textarea{resize:vertical;font-weight:700;}
  .ed-p{background:#ffffff14;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .ed-n{display:flex;justify-content:space-between;align-items:center;} .ed-n .mini{padding:4px 10px;font-size:15px;}
  .ed-ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .ed .ed-op{flex-direction:row;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;color:#fff;font-size:18px;}
  .ed-op input[type=radio]{width:22px;height:22px;flex:none;accent-color:#fff;margin:0;} .ed-op span{flex:none;} .ed-op input[type=text]{padding:8px 10px;font-size:15px;}
  @media (max-width:600px){ .ed-cab,.ed-ops{grid-template-columns:1fr;} }
  .ed-med{display:flex;gap:8px;align-items:center;flex-wrap:wrap;} .ed-med .mini{padding:7px 12px;font-size:14px;font-weight:800;} .chip{background:#fff;color:#1a1030;font-weight:800;padding:6px 12px;border-radius:999px;font-size:14px;}
  .capa{position:fixed;inset:0;background:#0009;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
  .capa-c{background:#fff;color:#222;border-radius:16px;padding:18px;width:min(520px,100%);max-height:88vh;display:flex;flex-direction:column;gap:6px;}
  .capa-c input{font:inherit;font-size:16px;padding:10px 12px;border:2px solid #ddd;border-radius:10px;width:100%;}
  .tabs{display:flex;gap:6px;margin-bottom:6px;} .tabs button{flex:1;padding:9px;border-radius:10px;background:#f1eff6;font-weight:800;} .tabs button.on{background:#1a1030;color:#fff;}
  .cj-l{overflow:auto;max-height:55vh;display:flex;flex-direction:column;gap:6px;margin-top:6px;} .cj-l button{background:#f7f6fb;text-align:left;padding:11px 14px;border-radius:10px;font-weight:800;font-size:15px;color:#1a1030;display:flex;justify-content:space-between;gap:10px;align-items:center;} .cj-l button:hover{background:#ece8f6;} .cj-l small{color:#888;font-weight:600;font-size:12px;}
  .media-g{flex:1;margin:4px 18px 12px;min-height:52vh;display:flex;border-radius:14px;overflow:hidden;background:#fff;}
  .media-p{flex:1;align-self:stretch;min-height:30vh;max-width:62vw;display:flex;border-radius:14px;overflow:hidden;background:#fff;}
  .media-g iframe,.media-g video,.media-p iframe,.media-p video{flex:1 1 auto;width:100%;height:auto;align-self:stretch;border:0;background:#000;} .media-g iframe[title],.media-p iframe[title]{background:#141a22;} .media-g,.media-p{background:#141a22;}
  #salir{position:fixed;left:12px;bottom:12px;z-index:50;background:#ffffff26;color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;backdrop-filter:blur(4px);} #salir:hover{background:#ffffff40;}
  @media print{ #salir{display:none;} }
</style></head><body>
<div id="app" class="pant"></div><button id="salir" hidden>✕ Salir</button>
<script>
const CONFIG = { SUPABASE_URL: "https://tizmzblksovdqqnlxpli.supabase.co", SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpem16Ymxrc292ZHFxbmx4cGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDQxMjMsImV4cCI6MjEwNjUyMDEyM30.eXScUQYTkSxtnNb4TO-FJUsdKpnkTk5z-1QLPjxHAGo" };
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON);
const $ = (id) => document.getElementById(id), APP = $("app"), P = new URLSearchParams(location.search);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FIG = ["▲", "◆", "●", "■", "★", "⬟"];
const LOGO = '<div class="logo"><img src="sf-192.png" alt=""> ScoutFlow · Test en directo</div>';
const canal = (cod) => sb.channel("vivo-" + cod, { config: { broadcast: { self: false, ack: false } } });

/* ======================= PANTALLA GRANDE (entrenador) ======================= */
const H = { test: null, preg: [], cod: "", ch: null, jug: {}, i: -1, fase: "lobby", fin: 0, ini: 0, resp: {}, timer: null, hist: [] };
async function hostInicio() {
  const { data: ses } = await sb.auth.getSession();
  if (!ses || !ses.session) { APP.innerHTML = `<div class="centro">${LOGO}<p>Entra primero en ScoutFlow con tu cuenta de entrenador y vuelve a abrir esta página.</p><a class="btn nar" href="entrenador.html" style="text-decoration:none;">Ir a ScoutFlow</a></div>`; return; }
  APP.innerHTML = `<div class="centro">${LOGO}<p class="peq">Cargando tests…</p></div>`;
  let T = [];
  const rv = await sb.from("tests_vivo").select("*").order("creado", { ascending: false });
  if (!rv.error) T = (rv.data || []).map(t => ({ ...t, propio: true }));
  const rp = await sb.from("tests").select("*").order("creado", { ascending: false });   /* la base de datos solo deja ver los tests de cada entrenador */
  if (!rp.error) T = T.concat((rp.data || []).map(t => ({ ...t, panel: true })));
  T = T.filter(t => (t.preguntas || []).some(p => (p.texto || "").trim()) || t.propio);
  H.lista = T;
  const id = P.get("test");
  const tId = id && T.find(x => x.id === id); if (tId && (tId.preguntas || []).length) return hostPreparar(tId);
  const nP = (t) => (t.preguntas || []).filter(p => (p.texto || "").trim()).length;
  const fila = (t) => `<div class="fila-t"><button class="jugar" data-t="${esc(t.id)}" ${nP(t) ? "" : "disabled"}>${esc(t.titulo || "Test")}<small>${nP(t)} pregunta${nP(t) === 1 ? "" : "s"}${t.panel ? " · del Panel" : ""}</small></button>${t.propio ? `<button class="mini" data-ed="${esc(t.id)}" title="Editar">✏️</button><button class="mini" data-bo="${esc(t.id)}" title="Borrar">🗑</button>` : ""}</div>`;
  APP.innerHTML = `<div class="centro">${LOGO}<h1 style="margin:0;">¿Qué test jugamos?</h1><p class="peq" style="margin:0;">Abre esta pantalla en la tele o el proyector. Los jugadores entran desde el móvil.</p>
    <button class="btn nar" id="nuevoT">➕ Crear test nuevo</button>
    <div class="lista-t">${T.map(fila).join("") || '<p class="peq">Todavía no tienes tests. Crea el primero con el botón de arriba.</p>'}</div>
    ${rv.error ? `<p class="err" style="font-size:13px;">Para crear tests aquí falta un paso en la base de datos (tests_vivo.sql).</p>` : ""}</div>`;
  $("nuevoT").onclick = () => edAbrir(null);
  APP.querySelectorAll("[data-t]").forEach(b => b.onclick = () => hostPreparar(T.find(t => t.id === b.dataset.t)));
  APP.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => edAbrir(T.find(t => t.id === b.dataset.ed)));
  APP.querySelectorAll("[data-bo]").forEach(b => b.onclick = async () => {
    const t = T.find(x => x.id === b.dataset.bo); if (!confirm(`¿Borrar el test "${t.titulo}"?`)) return;
    const r = await sb.from("tests_vivo").delete().eq("id", t.id); if (r.error) return alert("No se ha podido borrar: " + r.error.message); hostInicio();
  });
  const bs = $("salir"); bs.hidden = false; bs.textContent = "✕ Volver"; bs.onclick = () => { if (window.opener) window.close(); location.href = "entrenador.html"; };
}

/* ---------- crear / editar test (sin necesidad de Panel) ---------- */
const ED = { id: null, titulo: "", seg: 20, preg: [] };
const edVacia = () => ({ texto: "", opciones: ["", "", "", ""], correcta: 0, media: null });
function edAbrir(t) {
  ED.id = t ? t.id : null; ED.titulo = t ? (t.titulo || "") : ""; ED.seg = t ? (t.segundos || 20) : 20;
  ED.preg = t && (t.preguntas || []).length ? t.preguntas.map(p => { const o = (p.opciones || []).slice(0, 4); while (o.length < 4) o.push(""); return { texto: p.texto || "", opciones: o, correcta: p.correcta || 0, media: p.media || null }; }) : [edVacia()];
  edPintar();
  const bs = $("salir"); bs.hidden = false; bs.textContent = "✕ Volver"; bs.onclick = () => { if (confirm("¿Salir sin guardar?")) hostInicio(); };
}
function edLeer() {
  ED.titulo = $("edTit").value; ED.seg = parseInt($("edSeg").value, 10) || 20;
  APP.querySelectorAll(".ed-p").forEach((c, i) => {
    const p = ED.preg[i]; p.texto = c.querySelector(".ed-tx").value;
    c.querySelectorAll(".ed-op input[type=text]").forEach((x, k) => p.opciones[k] = x.value);
    const r = c.querySelector(".ed-op input[type=radio]:checked"); p.correcta = r ? +r.value : 0;
  });
}
function edPintar() {
  APP.innerHTML = `<div class="ed">${LOGO}
    <h1 style="margin:4px 0 0;">${ED.id ? "Editar test" : "Nuevo test"}</h1>
    <div class="ed-cab"><label>Título<input id="edTit" value="${esc(ED.titulo)}" placeholder="Ej.: Sistema 'Cuernos'"></label>
      <label>Segundos por pregunta<select id="edSeg">${[10, 15, 20, 30, 45, 60].map(n => `<option ${n === ED.seg ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>
    <p class="peq" style="margin:0;">Escribe cada pregunta y marca el círculo de la respuesta correcta. Mínimo 2 opciones.</p>
    ${ED.preg.map((p, i) => `<div class="ed-p"><div class="ed-n"><b>Pregunta ${i + 1}</b>${ED.preg.length > 1 ? `<button class="mini" data-q="${i}" title="Quitar">🗑</button>` : ""}</div>
      <textarea class="ed-tx" rows="2" placeholder="¿Qué hace el base cuando…?">${esc(p.texto)}</textarea>
      <div class="ed-ops">${p.opciones.map((o, k) => `<label class="ed-op c${k}"><input type="radio" name="c${i}" value="${k}" ${p.correcta === k ? "checked" : ""}><span>${FIG[k]}</span><input type="text" value="${esc(o)}" placeholder="Opción ${k + 1}${k > 1 ? " (opcional)" : ""}"></label>`).join("")}</div>
      <div class="ed-med">${p.media ? `<span class="chip">${p.media.t === "video" ? "🎬 Vídeo" : (p.media.tabla === "ejercicios" ? "🎯 " : "🏀 ") + esc(p.media.nombre || "Jugada") + (p.media.hasta ? ` · se para en la fase ${p.media.hasta}` : "")}</span><button class="mini" data-mx="${i}">✕ Quitar</button>` : `<button class="mini" data-mj="${i}">🏀 Añadir jugada</button><button class="mini" data-mv="${i}">🎬 Añadir vídeo</button><span class="peq">Se verá en la pantalla grande antes de contestar</span>`}</div></div>`).join("")}
    <button class="btn claro" id="edMas">➕ Añadir pregunta</button>
    <p class="err" id="edErr"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:60px;"><button class="btn" id="edCan">Cancelar</button><button class="btn nar" id="edOk">💾 Guardar</button></div></div>`;
  $("edMas").onclick = () => { edLeer(); ED.preg.push(edVacia()); edPintar(); const l = APP.querySelectorAll(".ed-tx"); l[l.length - 1].focus(); };
  APP.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { edLeer(); ED.preg.splice(+b.dataset.q, 1); edPintar(); });
  APP.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => { edLeer(); ED.preg[+b.dataset.mx].media = null; edPintar(); });
  APP.querySelectorAll("[data-mj]").forEach(b => b.onclick = () => { edLeer(); edElegirJugada(+b.dataset.mj); });
  APP.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { edLeer(); edElegirVideo(+b.dataset.mv); });
  $("edCan").onclick = () => hostInicio();
  $("edOk").onclick = edGuardar;
}
/* ventana flotante sencilla */
function capa(html) { const d = document.createElement("div"); d.className = "capa"; d.innerHTML = `<div class="capa-c">${html}</div>`; document.body.appendChild(d); d.addEventListener("mousedown", (e) => { if (e.target === d) d.remove(); }); return d; }
const diagDe = (x) => x && x.data && (x.data.pasos ? x.data : x.data.diagrama);
const EDJ = {};
async function edElegirJugada(i) {
  const c = capa(`<h3 style="margin:0 0 8px;">Elige la jugada</h3><div class="tabs"><button data-tb="jugadas" class="on">🏀 Jugadas</button><button data-tb="ejercicios">🎯 Ejercicios</button></div>
    <input id="cjQ" placeholder="Buscar por nombre…"><div id="cjL" class="cj-l"><p class="peq">Cargando…</p></div><div style="text-align:right;margin-top:8px;"><button class="btn" style="font-size:15px;padding:8px 16px;" id="cjX">Cancelar</button></div>`);
  let tabla = "jugadas", carp = null;
  c.querySelector("#cjX").onclick = () => c.remove();
  const cargar = async () => {
    if (!EDJ[tabla]) { const r = await sb.from(tabla).select("id,nombre,carpeta,data").order("nombre"); EDJ[tabla] = r.error ? [] : (r.data || []).filter(x => { const d = diagDe(x); return d && (d.pasos || []).length; }); }
    pinta();
  };
  const fila = (x) => `<button data-id="${esc(x.id)}">${tabla === "jugadas" ? "🏀" : "🎯"} ${esc(x.nombre || "(sin nombre)")}<small>${(diagDe(x).pasos || []).length} fases</small></button>`;
  const pinta = () => {
    const L = EDJ[tabla] || [], q = c.querySelector("#cjQ").value.trim().toLowerCase(), box = c.querySelector("#cjL");
    if (q) box.innerHTML = L.filter(x => (x.nombre || "").toLowerCase().includes(q)).map(fila).join("") || '<p class="peq">Nada con ese nombre.</p>';
    else if (carp === null) {

    const ops = []; let nc = 0; p.opciones.forEach((o, k) => { if (o.trim()) { if (k === p.correcta) nc = ops.length; ops.push(o.trim()); } });
    if (ops.length < 2) { err.textContent = `La pregunta ${i + 1} necesita al menos 2 opciones.`; return; }

function jugPintar() {
  const e = J.e; if (!e) return; const clave = e.fase + "|" + e.i;
  if (e.fase === "fin") { if (J.vis === "fin") return; J.vis = "fin"; clearInterval(J.hola); APP.innerHTML = `<div class="centro">${LOGO}<p class="gran">El juego ha terminado</p><button class="btn nar" id="jOtra">Entrar en otro juego</button></div>`; $("jOtra").onclick = () => jugSalir(false); return; }
  if (e.fase === "lobby") { if (J.vis === clave) return; J.vis = clave; APP.innerHTML = `<div class="centro">${LOGO}<p class="gran">¡Dentro, ${esc(J.nombre)}!</p><p class="peq" style="font-size:18px;">Mira la pantalla grande. Empieza enseguida…</p></div>`; return; }
  if (e.fase === "ver") { if (J.vis === clave) return; J.vis = clave; APP.innerHTML = `<div class="centro">${LOGO}<p class="gran">👀 Mira la pantalla</p><p class="peq" style="font-size:18px;">Fíjate bien: enseguida tendrás que responder.</p></div>`; return; }
  if (e.fase === "pregunta") {
    if (J.resp[e.i] !== undefined) { if (J.vis === clave + "r") return; J.vis = clave + "r"; APP.innerHTML = `<div class="centro"><p class="gran">Respuesta enviada</p><p class="peq" style="font-size:18px;">Espera a los demás… ⏳</p></div>`; return; }
    if (J.vis === clave) return; J.vis = clave; const ops = e.q.opciones;
    APP.innerHTML = `<div class="barra-top"><span>${e.i + 1} / ${e.n}</span><span class="esp"></span><span>${esc(J.nombre)}</span></div><div class="mops" style="${ops.length > 4 ? "grid-template-columns:1fr 1fr;" : ""}">${ops.map((o, k) => `<button class="c${k}" data-k="${k}">${FIG[k]}<small>${esc(o)}</small></button>`).join("")}</div>`;
    APP.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { if (J.resp[e.i] !== undefined) return; J.resp[e.i] = +b.dataset.k; J.ch.send({ type: "broadcast", event: "j", payload: { t: "resp", id: J.id, i: e.i, k: +b.dataset.k } }); if (navigator.vibrate) navigator.vibrate(30); jugPintar(); });
    return;
  }
  if (e.fase === "resultado" || e.fase === "podio") {
    const r = (e.res || {})[J.id]; if (J.vis === clave) return; J.vis = clave;
    if (!r) { APP.innerHTML = `<div class="centro"><p class="gran">Mira la pantalla 👀</p></div>`; return; }
    if (e.fase === "podio") { APP.innerHTML = `<div class="centro">${LOGO}<p class="gran">${r.pos <= 3 ? ["🥇", "🥈", "🥉"][r.pos - 1] : "🏁"} ${r.pos}º puesto</p><p style="font-size:26px;font-weight:900;">${r.pts} puntos</p><p class="peq" style="font-size:16px;">¡Gracias por jugar!</p></div>`; return; }
    const bien = !!r.ok;
    APP.innerHTML = `<div class="pant ${bien ? "ok" : "ko"}" style="min-height:100vh;"><div class="centro"><p class="gran">${bien ? "✔ ¡Correcto!" : J.resp[e.i] === undefined ? "⏰ Sin respuesta" : "✘ Incorrecto"}</p>${bien ? `<p style="font-size:26px;font-weight:900;">+${r.gan}${r.racha >= 2 ? " · 🔥 racha de " + r.racha : ""}</p>` : ""}<p style="font-size:20px;font-weight:800;">Vas ${r.pos}º · ${r.pts} puntos</p></div></div>`;
  }
}

if (P.get("host")) hostInicio(); else jugEntrar();
</script>
</body></html>
