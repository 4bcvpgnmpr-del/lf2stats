<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<title>Mi perfil · ScoutFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
  :root{
    --wood:#fdf8f2; --wood-line:#e4dcd0; --ink:#1b2430; --ink-soft:#5a6472;
    --white:#ffffff; --suave:#f7f3ec; --orange:#e0602a; --orange-dark:#c44f1e;
    --verde:#1f7a5a; --verde-suave:#eef7f2; --rojo:#b4470f; --rojo-suave:#fdf0ec;
    --sombra:rgba(27,36,50,.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--wood);color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .envoltorio{max-width:620px;margin:0 auto;padding:0 14px 60px;}
  h1,h2,h3{font-family:'Archivo Black',sans-serif;letter-spacing:-.3px;margin:0;}

  /* ---------- Entrar ---------- */
  .entrar{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 18px;}
  .marca{display:flex;align-items:center;gap:10px;}
  .marca .bola{width:34px;height:34px;border-radius:50%;background:var(--orange);flex:none;}
  .marca b{font-family:'Archivo Black',sans-serif;font-size:21px;}
  .marca span{color:var(--orange);}
  .caja{background:var(--white);border:1.5px solid var(--wood-line);border-radius:16px;
        padding:20px;box-shadow:0 6px 22px var(--sombra);}
  label{display:block;font-size:12.5px;font-weight:800;text-transform:uppercase;
        letter-spacing:.08em;color:var(--ink-soft);margin-bottom:6px;}
  input[type=email]{
    width:100%;font-family:inherit;font-size:16px;padding:13px 14px;
    border:1.5px solid var(--wood-line);border-radius:10px;background:var(--suave);color:var(--ink);
  }
  input[type=email]:focus{outline:none;border-color:var(--orange);background:var(--white);}
  .boton{
    width:100%;margin-top:12px;font-family:inherit;font-size:16px;font-weight:800;
    padding:14px;border:0;border-radius:10px;background:var(--orange);color:#fff;cursor:pointer;
  }
  .boton:active{background:var(--orange-dark);}
  .boton[disabled]{opacity:.55;cursor:default;}
  .boton.suave{background:var(--ink);}
  .aviso{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;}
  .aviso.ok{background:var(--verde-suave);border:1.5px solid #cfe6da;color:#14543d;}
  .aviso.mal{background:var(--rojo-suave);border:1.5px solid #f0cdbe;color:#8a3608;}
  .pie{font-size:12.5px;color:var(--ink-soft);text-align:center;}

  /* ---------- Cabecera ---------- */
  .cabecera{
    background:var(--ink);color:#fff;border-radius:0 0 22px 22px;
    padding:18px 16px 22px;margin:0 -14px 18px;display:flex;gap:14px;align-items:center;
  }
  .cabecera img, .cabecera .sinfoto{
    width:68px;height:68px;border-radius:50%;object-fit:cover;object-position:top center;
    flex:none;background:#2c3747;box-shadow:0 0 0 3px rgba(255,255,255,.14);
  }
  .cabecera .sinfoto{display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:21px;color:#8995a6;}
  .cabecera h1{font-size:21px;line-height:1.15;}
  .cabecera .eq{font-size:13.5px;opacity:.75;margin-top:3px;}
  .salir{margin-left:auto;background:none;border:1.5px solid rgba(255,255,255,.3);
    color:#fff;border-radius:20px;padding:6px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;}

  /* ---------- Pestanas ---------- */
  .pestanas{display:flex;gap:6px;margin-bottom:16px;}
  .pestanas button{
    flex:1;font-family:inherit;font-size:13.5px;font-weight:800;padding:11px 6px;
    border:1.5px solid var(--wood-line);background:var(--white);color:var(--ink-soft);
    border-radius:11px;cursor:pointer;position:relative;
  }
  .pestanas button.activa{background:var(--orange);border-color:var(--orange);color:#fff;}
  .pestanas .punto{
    position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--orange);
  }
  .pestanas button.activa .punto{background:#fff;}

  [hidden]{display:none !important;}   /* si no, el display:flex gana y se ve todo a la vez */
  /* ---------- Para imprimir o guardar en PDF ---------- */
  @media print{
    @page{ size:A4 portrait; margin:14mm 12mm 16mm; @bottom-center{content:"Pagina " counter(page) " de " counter(pages);font-size:8pt;color:#777;} }
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body{background:#fff !important;color:#111;font-size:10.5pt;}
    .pestanas, .salir, .visor, #visor, button, .punto, #pantallaEntrar{display:none !important;}
    .cabecera{background:#fff !important;color:#111 !important;border-bottom:3px solid #1b2430;border-radius:0;padding:0 0 8px;margin-bottom:12px;}
    .cabecera h1, .cabecera .eq{color:#111 !important;}
    .envoltorio{max-width:none !important;padding:0 !important;}
    .bloque, .clip, .sr-plant, .seccion-rival, .sj-todas, .item{box-shadow:none !important;border-color:#d9d2c8 !important;}
    .bloque{break-inside:auto;page-break-inside:auto;margin-bottom:12px;}
    .bloque > h3, h3{break-after:avoid;page-break-after:avoid;}
    .sr-plant, .clip, .sj-grid, .sj-mapa, svg.carta, .pizarras-mini, .sj-nota, table tr, .marco{break-inside:avoid;page-break-inside:avoid;}
    img, svg{max-width:100% !important;height:auto;}
    .sj-mapa{max-width:95mm !important;}
    .pizarras-mini img{height:38mm !important;}
    .marco iframe, .marco video{display:none !important;}
    .marco{display:none !important;}
    table{width:100% !important;font-size:8.5pt;}
    td, th{overflow-wrap:anywhere;}
    [hidden]{display:none !important;}
  }


  /* ---------- Numeros ---------- */
  .rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
  .dato{background:var(--white);border:1.5px solid var(--wood-line);border-radius:13px;
        padding:12px 8px;text-align:center;}
  .dato .v{font-family:'Archivo Black',sans-serif;font-size:23px;line-height:1.1;}
  .dato .l{font-size:10.5px;font-weight:800;text-transform:uppercase;
           letter-spacing:.06em;color:var(--ink-soft);margin-top:3px;}
  .bloque{background:var(--white);border:1.5px solid var(--wood-line);border-radius:15px;
          padding:16px;margin-bottom:14px;}
  .bloque h3{font-size:15.5px;margin-bottom:4px;}
  .bloque .expl{font-size:13px;color:var(--ink-soft);margin:0 0 12px;}

  .barra{margin-bottom:13px;}
  .barra .arriba{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .barra .arriba b{font-weight:800;}
  .barra .pista{height:9px;border-radius:5px;background:var(--suave);position:relative;overflow:hidden;}
  .barra .relleno{height:100%;border-radius:5px;background:var(--orange);}
  .barra .relleno.alto{background:var(--verde);}
  .barra .relleno.bajo{background:var(--rojo);}
  .barra .pie-barra{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- Mensajes ---------- */
  .mensaje{background:var(--white);border:1.5px solid var(--wood-line);
           border-left:4px solid var(--orange);border-radius:12px;padding:14px;margin-bottom:11px;}
  .mensaje.nuevo{background:var(--rojo-suave);}
  .mensaje .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:5px;}
  .mensaje .cab b{font-size:14.5px;}
  .mensaje .cab span{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .mensaje p{margin:0;white-space:pre-wrap;font-size:14.5px;}
  .etiqueta-nuevo{background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;
    border-radius:10px;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em;}

  /* ---------- Objetivos ---------- */
  .objetivo{display:flex;gap:11px;align-items:flex-start;background:var(--white);
    border:1.5px solid var(--wood-line);border-radius:12px;padding:13px;margin-bottom:9px;}
  .objetivo .marca-ob{width:22px;height:22px;border-radius:50%;flex:none;margin-top:1px;
    border:2px solid var(--wood-line);display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;}
  .objetivo.hecho .marca-ob{background:var(--verde);border-color:var(--verde);}
  .objetivo .txt{font-size:14.5px;}
  .objetivo .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Clips ---------- */
  .clip{background:var(--white);border:1.5px solid var(--wood-line);border-radius:14px;
        overflow:hidden;margin-bottom:13px;}
  .clip .marco{position:relative;padding-bottom:56.25%;height:0;background:#000;}
  .clip .marco iframe, .clip .marco video{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .clip .fuera{padding:22px 16px;text-align:center;background:var(--suave);}
  .clip .texto{padding:12px 14px;}
  .clip .texto b{font-size:14.5px;}
  .clip .texto p{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;}

  .diag-previa{margin-top:14px;background:#fff8e6;border:1.5px solid #e8d9a8;
    border-radius:12px;padding:14px;font-size:13.5px;color:#5a4a1f;text-align:left;}
  .diag-previa b{display:block;margin-bottom:6px;}
  .diag-previa p{margin:6px 0;}
  .diag-previa ul{margin:4px 0 0;padding-left:20px;}
  .diag-previa code{background:#fff;padding:1px 5px;border-radius:4px;font-size:12.5px;}
  .elector{display:flex;flex-direction:column;gap:8px;}
  .eleg{display:block;width:100%;text-align:left;background:var(--white);
    border:1.5px solid var(--wood-line);border-radius:12px;padding:13px 15px;
    font-family:inherit;color:var(--ink);cursor:pointer;}
  .eleg b{display:block;font-size:15px;}
  .eleg span{font-size:12.5px;color:var(--ink-soft);}
  .barra-previa{background:#1b2430;color:#fff;font-size:13px;padding:9px 14px;
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;}
  .barra-previa b{color:var(--orange);}
  .barra-previa button{margin-left:auto;background:none;border:1.5px solid rgba(255,255,255,.3);
    color:#fff;border-radius:16px;padding:4px 11px;font-family:inherit;font-size:12px;cursor:pointer;}
  .seccion-rival{border-left:3px solid var(--orange);padding:2px 0 2px 12px;margin:14px 0;}
  .seccion-rival .sr-tit{font-size:12px;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--orange);margin-bottom:3px;}
  .seccion-rival p{margin:0;white-space:pre-wrap;font-size:14.5px;}

  .sr-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .sr-dato{background:var(--suave);border:1.5px solid var(--wood-line);border-radius:11px;
           padding:10px 6px;text-align:center;}
  .sr-dato .v{font-family:'Archivo Black',sans-serif;font-size:19px;line-height:1.1;}
  .sr-dato .l{font-size:10.5px;font-weight:800;text-transform:uppercase;
              letter-spacing:.05em;color:var(--ink-soft);margin-top:3px;}
  .sr-dato .p{font-size:10px;color:var(--ink-soft);margin-top:1px;}

  .sr-partidos{display:flex;flex-direction:column;gap:6px;}
  .sr-partido{display:flex;align-items:center;gap:9px;background:var(--suave);
              border:1.5px solid var(--wood-line);border-radius:10px;padding:8px 11px;font-size:14px;}
  .sr-partido .riv{flex:1;min-width:0;}
  .sr-partido b{font-variant-numeric:tabular-nums;}
  .vd{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;
      justify-content:center;font-size:11.5px;font-weight:800;color:#fff;}
  .vd.v{background:var(--verde);} .vd.d{background:var(--rojo);}

  .sr-tabla-caja{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .sr-tabla{width:100%;border-collapse:collapse;font-size:13.5px;}
  .sr-tabla th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
               text-align:right;padding:5px 6px;border-bottom:1.5px solid var(--wood-line);white-space:nowrap;}
  .sr-tabla td{text-align:right;padding:6px;border-bottom:1px solid var(--wood-line);
               font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sr-tabla .izq{text-align:left;white-space:normal;}
  .sr-tabla tbody tr:nth-child(odd) td{background:var(--suave);}

  .sr-reparto-tit{font-size:12.5px;font-weight:800;color:var(--ink-soft);margin:12px 0 5px;}
  .sr-reparto{display:flex;height:26px;border-radius:7px;overflow:hidden;font-size:11px;font-weight:800;}
  .sr-reparto span{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;}
  .sr-reparto .r2{background:var(--orange);} .sr-reparto .r3{background:var(--ink);}
  .sr-reparto .rt{background:#9aa5b4;}
  .sr-leyenda{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--ink-soft);}
  .sr-leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;}
  .sr-leyenda .r2{background:var(--orange);} .sr-leyenda .r3{background:var(--ink);}
  .sr-leyenda .rt{background:#9aa5b4;}

  .sr-jugs{display:flex;flex-direction:column;gap:8px;}
  .sj-puesto{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
             color:var(--orange);margin-top:2px;}
  .sj-nota{margin-top:6px;font-size:13.5px;white-space:pre-wrap;border-left:2px solid var(--wood-line);
           padding-left:9px;color:var(--ink);}
  .sr-jug{display:flex;gap:11px;align-items:flex-start;background:var(--suave);
          border:1.5px solid var(--wood-line);border-radius:12px;padding:9px 11px;}
  .sr-jug img, .sr-jug .sinfoto2{width:46px;height:46px;border-radius:50%;object-fit:cover;
          object-position:top center;flex:none;background:var(--wood-line);
          display:flex;align-items:center;justify-content:center;font-weight:800;
          font-size:13px;color:var(--ink-soft);}
  .sj-info{min-width:0;flex:1;}
  .sj-info b{display:block;font-size:14px;line-height:1.2;}
  .sj-info .dor{display:inline-block;background:var(--ink);color:#fff;border-radius:5px;
          font-size:11px;padding:0 5px;margin-right:6px;vertical-align:1px;}
  .pizarras-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 14px 4px;}
  .pizarras-mini img{display:block;width:100%;height:110px;object-fit:contain;background:#fff;
    border:1.5px solid var(--wood-line);border-radius:8px;cursor:zoom-in;}
  .sj-mapa{display:block;width:100%;max-width:420px;height:auto;margin:8px auto 6px;border-radius:10px;cursor:zoom-in;}
  .sj-zonas{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;}
  .sj-zonas th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:right;padding:3px 4px;}
  .sj-zonas td{padding:4px;text-align:right;border-top:1px solid var(--wood-line);}
  .sj-zonas th:first-child,.sj-zonas td:first-child{text-align:left;}
  svg.carta{width:100%;max-width:440px;height:auto;display:block;margin:0 auto 10px;border-radius:10px;}
  svg.carta .madera{fill:#f3e6d2}svg.carta .linea{fill:none;stroke:#c2ac8c;stroke-width:2.5;stroke-linejoin:round}
  svg.carta .tablero{stroke:#8a6a4f;stroke-width:5;stroke-linecap:round}svg.carta .aro{fill:none;stroke:#c0562a;stroke-width:3.5}
  svg.carta .burbuja text{text-anchor:middle;font-weight:800;fill:#3a2d20}svg.carta .burbuja circle{stroke-width:2.5}
  svg.carta .b-pct{font-size:20px;fill:#20170e}svg.carta .b-int{font-size:13px;font-weight:700}
  svg.carta .z-buena circle{fill:rgba(64,176,132,.8);stroke:#14543d}svg.carta .z-media circle{fill:rgba(240,181,68,.85);stroke:#9a6b12}
  svg.carta .z-mala circle{fill:rgba(224,110,76,.8);stroke:#8c3a12}
  svg.carta .tiro-dentro{fill:rgba(31,122,90,.75);stroke:#14543d}svg.carta .tiro-fuera{fill:rgba(199,80,40,.55);stroke:#8c3a12}
  .subnav{display:flex;gap:6px;}
  .subnav button{flex:1;padding:9px;border:1.5px solid var(--wood-line);background:var(--white);border-radius:9px;
    font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .subnav button.active{background:var(--orange);border-color:var(--orange);color:#fff;}
  .sr-plant{background:var(--suave);border:1.5px solid var(--wood-line);border-radius:12px;margin-bottom:8px;}
  .sr-plant-cab{display:flex;gap:10px;align-items:center;padding:9px 11px;}
  .sr-plant>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 11px;}
  .sr-plant>summary::-webkit-details-marker{display:none;}
  .sr-plant .cuerpo{padding:0 11px 11px;}
  .sr-plant .cuerpo .sj-nota{margin:0 0 8px;}
  .sj-todas{margin-top:7px;}
  .sj-todas summary{font-size:12.5px;font-weight:800;color:var(--orange);cursor:pointer;}
  .sj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:7px;}
  .sj-grid div{background:var(--white);border:1.5px solid var(--wood-line);border-radius:8px;padding:5px 6px;text-align:center;}
  .sj-grid b{display:block;font-size:13px;font-variant-numeric:tabular-nums;}
  .sj-grid i{font-style:normal;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .sj-datos{display:flex;gap:11px;margin-top:4px;flex-wrap:wrap;}
  .sj-datos span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sj-datos i{font-style:normal;font-size:9.5px;font-weight:800;text-transform:uppercase;
          letter-spacing:.05em;color:var(--ink-soft);margin-right:3px;}

  .sr-mp{border:1.5px solid var(--wood-line);border-radius:11px;padding:10px 12px;margin-bottom:8px;}
  .sr-mp .mp-tit{font-size:13px;font-weight:800;margin-bottom:6px;}
  .sr-mp .mp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sr-mp .eti{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;
              letter-spacing:.05em;padding:1px 7px;border-radius:9px;margin-bottom:4px;}
  .sr-mp .eti.buena{background:var(--verde-suave);color:var(--verde);}
  .sr-mp .eti.mala{background:var(--rojo-suave);color:var(--rojo);}
  .sr-mp .mp-fila{display:flex;justify-content:space-between;gap:7px;font-size:12.5px;padding:1px 0;}
  .sr-mp .mp-fila span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media (max-width:420px){ .sr-mp .mp-cols{grid-template-columns:1fr;} }
  .vacio{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 16px;
         background:var(--white);border:1.5px dashed var(--wood-line);border-radius:14px;}
  .cargando{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px;}

  @media (prefers-color-scheme: dark){
    :root:not([data-tema="claro"]){
      --wood:#161b22; --wood-line:#2b3341; --ink:#eef1f5; --ink-soft:#9aa5b4;
      --white:#1d242e; --suave:#232b36; --verde-suave:#16302a; --rojo-suave:#33211a;
    }
  }
</style>
</head>
<body>

<!-- ============ ENTRAR ============ -->
<div class="entrar" id="pantallaEntrar">
  <div class="envoltorio" style="padding:0;">
    <div class="marca" style="margin-bottom:18px;">
      <div class="bola"></div><b>Scout<span>Flow</span></b>
    </div>
    <h1 style="font-size:25px;margin-bottom:8px;">Tu perfil</h1>
    <p style="color:var(--ink-soft);margin:0 0 18px;">
      Tus estadisticas, los videos que te manda el entrenador y sus mensajes para ti.
    </p>
    <div class="caja">
      <div class="subnav" id="accesoModos" style="margin:0 0 14px;">
        <button type="button" class="active" data-modo="entrar">Entrar</button>
        <button type="button" data-modo="crear">Crear mi cuenta</button>
      </div>
      <div id="bloqueAcceso">
        <label for="correo">Tu correo</label>
        <input type="email" id="correo" placeholder="nombre@correo.com"
               autocomplete="email" inputmode="email" autocapitalize="off">

<script>
/* ============================================================

const CONFIG = {
  // Supabase -> Project Settings -> API
  SUPABASE_URL: "https://tizmzblksovdqqnlxpli.supabase.co",
  SUPABASE_ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpem16Ymxrc292ZHFxbmx4cGxpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDQxMjMsImV4cCI6MjEwNjUyMDEyM30.eXScUQYTkSxtnNb4TO-FJUsdKpnkTk5z-1QLPjxHAGo",

  // El mismo Google Sheet que usa la app del entrenador
  SHEET_ID: "1xu9dPT5RYAcEsH0MYdBJbLNLW4u7ajXNF3Kr9GGBT94",
  TEMPORADA: "_2026",     // de partida; la decide el entrenador desde su panel
};
const ETIQUETA_TEMPORADA = { "2026": "2026/27", "2025": "2025/26" };
let temporadaElegida = "2026";
const VERSION = "2026-10-02x";

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function limpiarNombre(t) {
  return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/\s+/g, " ").trim().toUpperCase();
}
function fechaCorta(iso) {
  try {
    return new Date(iso).toLocaleDateString("es-ES",
      { day: "2-digit", month: "short", year: "numeric" });
  } catch (e) { return ""; }
}
function numero(txt) {
  if (txt === null || txt === undefined || txt === "") return null;
  const n = parseFloat(String(txt).replace("%", "").replace(",", "."));
  return isNaN(n) ? null : n;
}
function conComa(n, dec) {
  if (n === null || n === undefined) return "–";
  return Number(n).toFixed(dec === undefined ? 1 : dec).replace(".", ",");
}

/* Lee una pestana del Google Sheet. Igual que en la app del entrenador:
   JSONP, porque el Sheet no deja leerlo de la forma normal. */
function leerPestana(nombreTab, consulta) {
  return new Promise((ok) => {
    const tab = nombreTab + CONFIG.TEMPORADA;
    const cb = "lf2cb_" + Math.random().toString(36).slice(2);
    const limpiar = () => {
      delete window[cb];
      if (guion.parentNode) guion.parentNode.removeChild(guion);
      clearTimeout(reloj);
    };
    window[cb] = (resp) => {
      limpiar();
      const t = resp && resp.table;
      if (!t || !t.cols) return ok(null);
      const cols = t.cols.map(c => (c.label || c.id || "").trim());
      const filas = (t.rows || []).map(r => {
        const o = {};
        cols.forEach((c, i) => {
          const celda = r.c && r.c[i];
          o[c] = celda ? (celda.f != null ? celda.f : (celda.v != null ? celda.v : "")) : "";
        });
        return o;
      });
      ok({ cols, ids: t.cols.map(c => c.id), filas });
    };
    const guion = document.createElement("script");
    guion.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
      + `?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(tab)}&headers=1`
      + (consulta ? `&tq=${encodeURIComponent(consulta)}` : "");
    guion.onerror = () => { limpiar(); ok(null); };
    const reloj = setTimeout(() => { limpiar(); ok(null); }, consulta ? 30000 : 15000);
    document.head.appendChild(guion);
  });
}

/* ============================================================
   ENTRAR Y SALIR
   ============================================================ */
let sb = null;
let jugadora = null;

function recordarSesion() { try { return localStorage.getItem("lf2_recordar") !== "0"; } catch (e) { return true; } }
function arrancarSupabase(persistir) {
  if (!window.supabase || !window.supabase.createClient) return null;
  if (CONFIG.SUPABASE_ANON.indexOf("PEGA_AQUI") === 0) return null;
  const quedarse = persistir === undefined ? recordarSesion() : persistir;
  let almacen;
  try { almacen = quedarse ? window.localStorage : window.sessionStorage; } catch (e) { almacen = undefined; }
  return window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON,
    { auth: { storage: almacen, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
}

function avisar(donde, texto, tipo) {
  $(donde).innerHTML = `<div class="aviso ${tipo}">${esc(texto)}</div>`;
}

let modoAcceso = "entrar";
function cambiarModoAcceso(m) {
  modoAcceso = m;
  document.querySelectorAll("#accesoModos button").forEach(b => b.classList.toggle("active", b.getAttribute("data-modo") === m));
  $("campoClave2").hidden = m !== "crear";
  $("btnEntrar").textContent = m === "crear" ? "Crear mi cuenta" : "Entrar";
  $("clave").setAttribute("autocomplete", m === "crear" ? "new-password" : "current-password");
  $("btnOlvide").hidden = m === "crear";
  $("avisoEntrar").innerHTML = "";
}
function traducirErrorAcceso(msg) {
  const m = String(msg || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos. Si es tu primera vez, pulsa «Crear mi cuenta»; si ya tenias cuenta pero no contraseña, usa «He olvidado mi contraseña».";
  if (m.includes("already registered") || m.includes("already been registered")) return "Ya existe una cuenta con ese correo. Pulsa «Entrar», o «He olvidado mi contraseña» si todavia no has puesto una.";
  if (m.includes("email not confirmed")) return "Tienes que confirmar el correo: abre el enlace que te hemos mandado y vuelve a entrar.";
  if (m.includes("password") && m.includes("6")) return "La contraseña tiene que tener al menos 6 caracteres.";
  if (m.includes("rate limit") || m.includes("too many")) return "Demasiados intentos seguidos. Espera unos minutos y vuelve a probar.";
  return msg;
}
function cambiarAlmacenSesion(quedarse) {
  try {
    const antes = recordarSesion();
    localStorage.setItem("lf2_recordar", quedarse ? "1" : "0");
    if (antes !== quedarse) {
      // si no quiere quedarse, se borra la sesion guardada de antes para que no siga abierta
      if (!quedarse) Object.keys(localStorage).filter(k => /^sb-.*-auth-token$/.test(k)).forEach(k => localStorage.removeItem(k));
      sb = arrancarSupabase(quedarse);
      engancharSesion();
    }
  } catch (e) { /* se queda como estaba */ }
}
async function pedirAcceso() {
  const correo = $("correo").value.trim().toLowerCase(), clave = $("clave").value;
  if (!correo || correo.indexOf("@") < 1) { avisar("avisoEntrar", "Escribe tu correo completo.", "mal"); return; }
  if (!clave) { avisar("avisoEntrar", "Escribe tu contraseña.", "mal"); return; }
  if (!sb) { avisar("avisoEntrar", "La app todavia no esta conectada. Avisa al entrenador.", "mal"); return; }
  if (modoAcceso === "crear") {
    if (clave.length < 6) { avisar("avisoEntrar", "La contraseña tiene que tener al menos 6 caracteres.", "mal"); return; }
    if (clave !== $("clave2").value) { avisar("avisoEntrar", "Las dos contraseñas no coinciden.", "mal"); return; }
  }
  cambiarAlmacenSesion($("recordar").checked);
  const btn = $("btnEntrar"), texto = btn.textContent;
  btn.disabled = true; btn.textContent = "Un momento...";
  let res;
  try {
    res = modoAcceso === "crear"
      ? await sb.auth.signUp({ email: correo, password: clave, options: { emailRedirectTo: location.href.split("#")[0] } })
      : await sb.auth.signInWithPassword({ email: correo, password: clave });
  } catch (e) { res = { error: { message: String(e && e.message || e) } }; }
  btn.disabled = false; btn.textContent = texto;
  if (res.error) { avisar("avisoEntrar", traducirErrorAcceso(res.error.message), "mal"); return; }
  const ses = res.data && res.data.session;
  if (ses) { cargarPerfil(ses); return; }
  if (modoAcceso === "crear") {
    const yaExiste = res.data && res.data.user && res.data.user.identities && res.data.user.identities.length === 0;
    avisar("avisoEntrar", yaExiste
      ? "Ya existe una cuenta con ese correo. Pulsa «Entrar», o «He olvidado mi contraseña» si todavia no has puesto una."
      : "Cuenta creada. Te hemos mandado un correo para confirmarla: abre el enlace y vuelve a entrar.", yaExiste ? "mal" : "ok");
  }
}
async function olvideClave() {
  const correo = $("correo").value.trim().toLowerCase();
  if (!correo || correo.indexOf("@") < 1) { avisar("avisoEntrar", "Escribe primero tu correo arriba.", "mal"); return; }
  if (!sb) return;
  const { error } = await sb.auth.resetPasswordForEmail(correo, { redirectTo: location.href.split("#")[0] });
  if (error) { avisar("avisoEntrar", traducirErrorAcceso(error.message), "mal"); return; }
  avisar("avisoEntrar", "Listo. Te hemos mandado un correo: abre el enlace desde este mismo aparato y elige tu nueva contraseña. Mira tambien el spam.", "ok");
}
function mostrarNuevaClave() {
  $("pantallaEntrar").hidden = false; $("pantallaPerfil").hidden = true;
  $("bloqueAcceso").hidden = true; $("accesoModos").hidden = true; $("bloqueNueva").hidden = false;
  $("pieAcceso").textContent = "";
}
async function guardarNuevaClave() {
  const c = $("claveNueva").value;
  if (c.length < 6) { avisar("avisoEntrar", "La contraseña tiene que tener al menos 6 caracteres.", "mal"); return; }
  const { error } = await sb.auth.updateUser({ password: c });
  if (error) { avisar("avisoEntrar", traducirErrorAcceso(error.message), "mal"); return; }
  const { data } = await sb.auth.getSession();
  history.replaceState(null, "", location.href.split("#")[0]);
  enRecuperacion = false;
  if (data && data.session) cargarPerfil(data.session); else location.reload();
}

async function salir() {
  if (sb) await sb.auth.signOut();
  location.reload();
}

/* ============================================================
   CARGAR LO SUYO
   ============================================================ */
let modoVistaPrevia = false;

async function cargarPerfil(sesion) {
  $("pantallaEntrar").hidden = true;
  $("pantallaPerfil").hidden = false;
  $("pieVersion").textContent = "v" + VERSION;
  $("tab-numeros").innerHTML = `<p class="cargando">Cargando tus datos...</p>`;

  const correo = (sesion.user && sesion.user.email) || "";

  // Vista previa: el entrenador abre ?ver=<id> para ver el perfil de una
  // jugadora tal y como lo ve ella. Nadie mas puede: el servidor no le
  // dejaria leer esa ficha.
  const quiere = new URLSearchParams(location.search).get("ver");
  // Si esta consulta fallara, la jugadora no puede quedarse con la pantalla
  // en blanco: se da por hecho que no es entrenadora y se sigue.
  let soyEntrenador = false;
  try {
    const r = await sb.rpc("es_entrenador");
    soyEntrenador = (r && r.data === true);
  } catch (e) { soyEntrenador = false; }

  if (soyEntrenador) {
    const { data: todas } = await sb.from("jugadoras").select("*").order("nombre");
    const lista = todas || [];

    // ?ver vale con el codigo, con el correo o con parte del nombre
    let elegida = null;
    if (quiere) {
      const q = limpiarNombre(quiere);
      elegida = lista.find(j => String(j.id) === quiere)
        || lista.find(j => (j.email || "").toLowerCase() === quiere.toLowerCase())
        || lista.find(j => limpiarNombre(j.nombre).includes(q));
    }

    // Sin ?ver (o sin acertar): se le deja elegir
    if (!elegida) {
      pintarElectorJugadoras(lista, quiere);
      return;
    }

    {
      {
        jugadora = elegida;
        modoVistaPrevia = true;
        document.body.insertAdjacentHTML("afterbegin", `<div class="barra-previa">
          Vista previa &middot; asi lo ve <b>${esc(jugadora.nombre)}</b>
          <button id="btnCerrarPrevia">Cerrar</button></div>`);
        $("btnCerrarPrevia").addEventListener("click", () => window.close() || history.back());
        pintarCabecera(null);
        cargarMensajes();
        cargarClips();
        cargarInformes();
        aplicarTemporada().then(() => cargarNumeros().then(cargarObjetivos));
        return;
      }
    }
  }

  // 1) Su ficha. Las reglas del servidor solo le dejan ver la suya.
  const { data: fichas, error } = await sb.from("jugadoras").select("*").limit(5);
  if (error) {
    $("tab-numeros").innerHTML =
      `<div class="vacio">No se han podido cargar tus datos.<br><br>${esc(error.message)}</div>`;
    return;
  }
  jugadora = (fichas || []).find(f => (f.email || "").toLowerCase() === correo.toLowerCase())
             || (fichas || [])[0];

  if (!jugadora) {
    $("cabecera").innerHTML = `<div><h1>Hola</h1><div class="eq">${esc(correo)}</div></div>
      <button class="salir" id="btnSalir">Salir</button>`;
    $("btnSalir").addEventListener("click", salir);
    $("tab-numeros").innerHTML = `<div class="vacio">
      Tu correo todavia no esta dado de alta.<br><br>
      Dile al entrenador que anada <b>${esc(correo)}</b> a tu ficha.</div>`;
    return;
  }

  pintarCabecera(null);
  cargarMensajes();
  cargarClips();
  // los objetivos se pintan DESPUES de los numeros: si no, cargarNumeros
  // reescribe la pestana entera y se los lleva por delante
  aplicarTemporada().then(() => cargarNumeros().then(cargarObjetivos));
  cargarInformes();
}

/* El entrenador no tiene ficha de jugadora: se le ofrece elegir a cual ver. */
function pintarElectorJugadoras(lista, buscado) {
  $("cabecera").innerHTML = `<div style="min-width:0;">
      <h1>Ver como lo ve una jugadora</h1>
      <div class="eq">Has entrado como entrenador</div>
    </div>
    <button class="salir" id="btnSalir">Salir</button>`;
  $("btnSalir").addEventListener("click", salir);
  document.querySelector(".pestanas").hidden = true;

  if (!lista.length) {
    $("tab-numeros").innerHTML = `<div class="vacio">Todavia no has dado de alta
      a ninguna jugadora. Hazlo desde tu panel.</div>`;
    return;
  }
  $("tab-numeros").innerHTML = `
    ${buscado ? `<div class="vacio" style="margin-bottom:12px;">No he encontrado
      a "${esc(buscado)}". Elige de la lista.</div>` : ""}
    <p class="expl" style="margin:0 0 12px;">Toca una para ver su perfil exactamente
      como lo ve ella. Mirar no cuenta como leer: sus mensajes siguen marcados como nuevos.</p>
    <div class="elector">
      ${lista.map(j => `<button class="eleg" data-id="${esc(j.id)}">
        <b>${esc(j.nombre)}</b><span>${esc(j.equipo || "")}</span></button>`).join("")}
    </div>`;
  document.querySelectorAll(".eleg").forEach(b => b.addEventListener("click", () => {
    location.search = "?ver=" + encodeURIComponent(b.getAttribute("data-id"));
  }));
}

function pintarCabecera(foto) {
  const iniciales = limpiarNombre(jugadora.nombre).slice(0, 2);
  $("cabecera").innerHTML = `
    ${foto ? `<img src="${esc(foto)}" alt="" onerror="this.outerHTML='<div class=\\'sinfoto\\'>${esc(iniciales)}</div>'">`
           : `<div class="sinfoto">${esc(iniciales)}</div>`}
    <div style="min-width:0;">
      <h1>${esc(jugadora.nombre)}</h1>
      <div class="eq">${esc(jugadora.equipo || "")}${jugadora.dorsal ? " · dorsal " + esc(jugadora.dorsal) : ""}</div>
    </div>
    <button class="salir" id="btnSalir">Salir</button>`;
  $("btnSalir").addEventListener("click", salir);
}

/* El entrenador decide que temporada ven, desde su panel. */
async function aplicarTemporada() {

    const { data } = await sb.from("ajustes").select("valor").eq("clave", "temporada").limit(1);
    if (data && data.length && data[0].valor) temporadaElegida = String(data[0].valor);

/* ---------- Pestana 1: sus numeros ----------
   Cada estadistica es una pestana distinta del Sheet (son los rankings de la
   FEB) y todas tienen la misma forma: Jugador, Equipo, Tot, Part, Med, Grupo. */
const CATEGORIAS = [
  { tab: "Jugadoras",                  et: "Puntos",       corta: "PTS",  pct: false },
  { tab: "Jugadoras_Rebotes_Totales",  et: "Rebotes",      corta: "REB",  pct: false },
  { tab: "Jugadoras_Asistencias",      et: "Asistencias",  corta: "AS",   pct: false },

  { tab: "Jugadoras_Minutos_Jugados",  et: "Minutos",      corta: "MIN",  pct: false },
  { tab: "Jugadoras_Robos",            et: "Robos",        corta: "ROB",  pct: false },
  { tab: "Jugadoras_Pct_Tiros_2",      et: "Tiros de 2",   corta: "2P%",  pct: true },
  { tab: "Jugadoras_Pct_Tiros_3",      et: "Triples",      corta: "3P%",  pct: true },
  { tab: "Jugadoras_Pct_Tiros_Libres", et: "Tiros libres", corta: "TL%",  pct: true },
];

/* La FEB escribe "APELLIDO, NOMBRE" en los rankings y "NOMBRE APELLIDO" en las
   plantillas. Se comparan las palabras ordenadas, asi da igual el orden. */
function claveNombre(txt) {
  return limpiarNombre(txt).replace(/[.,]/g, " ")
    .split(/\s+/).filter(Boolean).sort().join(" ");
}

/* ============================================================
   MAPA DE TIRO Y ESTADISTICAS COMPLETAS (Mis numeros)
   ============================================================ */
const EXTRAS_TABS = [
  ["Jugadoras_Tapones_Favor", "TAP+", "Tapones a favor"], ["Jugadoras_Tapones_Contra", "TAP-", "Tapones en contra"],
  ["Jugadoras_Mates", "MAT", "Mates"], ["Jugadoras_Faltas_Recibidas", "FR", "Faltas recibidas"],
  ["Jugadoras_Faltas_Cometidas", "FC", "Faltas cometidas"],
];
const PISTA = { largo: 28, ancho: 15, aroX: 1.575, aroY: 7.5 };
const POS_ZONAS = {
  "Cerca del aro": { mx: 2.6, my: 7.5 }, "Pintura": { mx: 4.8, my: 7.5 }, "Media distancia": { mx: 7.0, my: 7.5 },
  "Triple frontal": { mx: 9.4, my: 7.5 }, "Triple 45 izq.": { mx: 7.6, my: 11.9 }, "Triple 45 der.": { mx: 7.6, my: 3.1 },
  "Triple esquina izq.": { mx: 1.5, my: 13.6 }, "Triple esquina der.": { mx: 1.5, my: 1.4 },
};
function coord(v) {
  const n = parseFloat(String(v == null ? "" : v).replace(",", "."));
  return isNaN(n) ? null : n;
}
function tiroMetros(fila) {
  let x = coord(fila.X), y = coord(fila.Y);
  if (x === null || y === null || x < 0 || x > 100 || y < 0 || y > 100) return null;
  if (x > 50) { x = 100 - x; y = 100 - y; }
  const mx = x / 100 * PISTA.largo, my = y / 100 * PISTA.ancho;
  return { mx, my, dist: Math.hypot(mx - PISTA.aroX, my - PISTA.aroY), anotado: String(fila.Anotado).trim() === "Si" };
}
function zonaTiro(t) {
  const dy = t.my - PISTA.aroY;
  const esquina = Math.abs(dy) > 5.5 && t.mx < 4.5;
  if (t.dist >= 6.75 || esquina) {
    if (esquina) return dy > 0 ? "Triple esquina izq." : "Triple esquina der.";
    if (Math.abs(dy) < 2.5) return "Triple frontal";
    return dy > 0 ? "Triple 45 izq." : "Triple 45 der.";
  }
  if (t.dist <= 1.6) return "Cerca del aro";
  if (Math.abs(dy) <= 2.45 && t.mx <= 5.8) return "Pintura";
  return "Media distancia";
}
function zonasDeTiros(tiros) {
  const m = {};
  tiros.forEach(t => { const z = zonaTiro(t); const d = m[z] || (m[z] = { zona: z, a: 0, i: 0 }); d.i++; if (t.anotado) d.a++; });
  return Object.values(m).map(d => ({
    ...d, pct: Math.round(d.a / d.i * 1000) / 10,
    pps: Math.round(d.a * (d.zona.startsWith("Triple") ? 3 : 2) / d.i * 100) / 100,
  })).sort((a, b) => b.i - a.i);
}
function pistaSvg(tiros, modo) {
  const ESC = 36, FONDO = 14, W = PISTA.ancho * ESC, H = FONDO * ESC;
  const X = (my) => (PISTA.ancho - my) * ESC, Y = (mx) => mx * ESC;
  const R3 = 6.75, B3 = 0.9, ay = PISTA.aroY, ax = PISTA.aroX;
  const yEsq = ax + Math.sqrt(R3 * R3 - Math.pow(ay - B3, 2));
  const arco3 = `M ${X(B3)} ${Y(0)} L ${X(B3)} ${Y(yEsq)} A ${R3 * ESC} ${R3 * ESC} 0 0 1 ${X(PISTA.ancho - B3)} ${Y(yEsq)} L ${X(PISTA.ancho - B3)} ${Y(0)}`;
  const fijo = `<rect x="${X(ay + 2.45)}" y="${Y(0)}" width="${4.9 * ESC}" height="${5.8 * ESC}" class="linea"></rect>
    <circle cx="${X(ay)}" cy="${Y(5.8)}" r="${1.8 * ESC}" class="linea"></circle>
    <path d="M ${X(ay + 1.25)} ${Y(ax)} A ${1.25 * ESC} ${1.25 * ESC} 0 0 0 ${X(ay - 1.25)} ${Y(ax)}" class="linea"></path>
    <line x1="${X(ay + 0.9)}" y1="${Y(1.2)}" x2="${X(ay - 0.9)}" y2="${Y(1.2)}" class="tablero"></line>
    <circle cx="${X(ay)}" cy="${Y(ax)}" r="${0.225 * ESC}" class="aro"></circle>
    <path d="M ${X(ay + 1.8)} ${Y(FONDO)} A ${1.8 * ESC} ${1.8 * ESC} 0 0 1 ${X(ay - 1.8)} ${Y(FONDO)}" class="linea"></path>`;
  let encima = "";
  if (modo === "puntos") {
    encima = tiros.map(t => `<circle cx="${X(t.my).toFixed(1)}" cy="${Y(t.mx).toFixed(1)}" r="7" class="${t.anotado ? "tiro-dentro" : "tiro-fuera"}"></circle>`).join("");
  } else {
    const zs = zonasDeTiros(tiros);
    const maxI = Math.max(...zs.map(z => z.i), 1);
    encima = zs.map(z => {
      const p = POS_ZONAS[z.zona]; if (!p) return "";
      const r = (0.55 + 0.55 * Math.sqrt(z.i / maxI)) * ESC, cx = X(p.my), cy = Y(p.mx);
      const col = z.pct >= 45 ? "z-buena" : (z.pct >= 33 ? "z-media" : "z-mala");
      return `<g class="burbuja ${col}"><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"></circle>
        <text x="${cx.toFixed(1)}" y="${(cy - 1).toFixed(1)}" class="b-pct">${Math.round(z.pct)}%</text>
        <text x="${cx.toFixed(1)}" y="${(cy + 15).toFixed(1)}" class="b-int">${z.a}/${z.i}</text></g>`;
    }).join("");
  }
  return `<svg class="carta" viewBox="0 0 ${W} ${H}"><rect x="0" y="0" width="${W}" height="${H}" class="madera"></rect>
    <rect x="1" y="1" width="${W - 2}" height="${H - 2}" class="linea"></rect><path d="${arco3}" class="linea"></path>${fijo}${encima}</svg>`;
}
/* "I. SERRANO GARCIA" o "SERRANO GARCIA, INES" contra mi nombre completo */
function mismoNombre(nombreTiro, mio) {
  const a = limpiarNombre(nombreTiro).replace(/[.,]/g, " ").split(/\s+/).filter(Boolean);
  const b = limpiarNombre(mio).replace(/[.,]/g, " ").split(/\s+/).filter(Boolean);
  if (a.length < 2 || !b.length) return false;
  return a.every(t => t.length === 1 ? b.some(x => x[0] === t) : b.includes(t));
}
const tablaZonasHtml = (zonas) => `<table class="sj-zonas"><thead><tr><th>Zona</th><th>Tiros</th><th>%</th><th>Pts/tiro</th></tr></thead><tbody>
  ${zonas.map(z => `<tr><td>${esc(z.zona)}</td><td>${esc(z.a)}/${esc(z.i)}</td><td>${conComa(z.pct, 1)}%</td><td>${conComa(z.pps, 2)}</td></tr>`).join("")}</tbody></table>`;

/* ============================================================
   EVOLUCION POR JORNADA, IMPACTO Y POSESIONES, ADN
   ============================================================ */
const nivelPct = (p) => p >= 80 ? "#1f7a5a" : (p <= 30 ? "#c75028" : "#c9a227");
const num0 = (t) => { const v = numero(t); return v === null ? 0 : v; };
const minutosDe = (t) => { const m = /^(\d+):([0-5]\d)/.exec(String(t || "")); return m ? Number(m[1]) + Number(m[2]) / 60 : num0(t); };
const parTiro = (t) => { const m = /(\d+)\s*\/\s*(\d+)/.exec(String(t || "")); return m ? { a: +m[1], i: +m[2] } : { a: 0, i: 0 }; };
const fechaOrd = (t) => { const m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(String(t || "")); return m ? Number(m[3] + m[2] + m[1]) : 0; };

function pintarImpacto(destino, encontrado, tiros) {
  const PESOS = [["VAL", 0.30, "Valoración"], ["PTS", 0.15, "Puntos"], ["MIN", 0.12, "Minutos"],
                 ["REB", 0.10, "Rebotes"], ["AS", 0.10, "Asistencias"]];
  let suma = 0, peso = 0;
  const det = [];
  PESOS.forEach(([c, w, t]) => {
    const d = encontrado.find(x => x.corta === c);
    if (d && d.percentil !== null && d.percentil !== undefined) { suma += d.percentil * w; peso += w; det.push([t, d.percentil, w]); }
  });
  const valor = peso ? Math.round(suma / peso) : null;
  let donut = "", lista = "";
  if (tiros) {
    const n = (c) => num0(tiros[c]);
    const pj = n("Partidos");
    const partes = [["Tiros de 2", n("T2I"), "#c9a227"], ["Tiros de 3", n("T3I"), "#e0a02a"],
      ["Tiros libres", 0.44 * n("TLI"), "#6b8ee0"], ["Pérdidas", n("Perdidas"), "#e0704c"], ["Asistencias", n("Asistencias"), "#40b084"]];
    const total = partes.reduce((a, p) => a + p[1], 0);
    if (total && pj) {
      const C = 2 * Math.PI * 40; let off = 0;
      donut = `<svg viewBox="0 0 120 120" style="width:130px;height:130px;flex:none;transform:rotate(-90deg);">${partes.map(p => {
        const len = p[1] / total * C; const s = `<circle cx="60" cy="60" r="40" fill="none" stroke="${p[2]}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`;
        off += len; return s; }).join("")}</svg>`;
      lista = `<div style="flex:1;min-width:150px;"><p class="expl" style="margin:0 0 6px;">${conComa(total / pj, 1)} jugadas tuyas por partido</p>
        ${partes.map(p => `<div style="display:flex;align-items:center;gap:7px;font-size:13.5px;padding:2px 0;">
          <span style="width:11px;height:11px;border-radius:50%;background:${p[2]};flex:none;"></span><span style="flex:1;">${esc(p[0])}</span>
          <b>${conComa(p[1] / total * 100, 1)}%</b><span style="color:var(--ink-soft);font-size:12px;">${conComa(p[1] / pj, 1)}/p</span></div>`).join("")}</div>`;
    }
  }
  if (valor === null && !donut) return;
  const etiqueta = valor === null ? "" : (valor >= 80 ? "Jugadora determinante" : valor >= 65 ? "Jugadora importante" : valor >= 45 ? "Rotación" : "Complemento");
  destino.innerHTML = `<div class="bloque"><h3>Impacto y posesiones</h3>
    ${valor !== null ? `<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;">
      <div style="font-size:42px;font-weight:900;color:${nivelPct(valor)};line-height:1;">${valor}<small style="font-size:15px;color:var(--ink-soft);">/100</small></div>
      <div><b>Índice de impacto${etiqueta ? " · " + etiqueta : ""}</b>
      <p class="expl" style="margin:2px 0 0;">Media de tu posición en la liga en ${det.map(d => esc(d[0].toLowerCase())).join(", ")}. Es un cálculo propio, no un dato oficial.</p></div></div>` : ""}
    ${donut ? `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">${donut}${lista}</div>
      <p class="expl" style="margin-top:8px;">Reparto de las jugadas que acaban en tus manos: tiros, pérdidas y asistencias.</p>` : ""}</div>`;
}

function pintarAdn(destino, encontrado, extrasPct) {
  const p = (c) => { const d = encontrado.find(x => x.corta === c); return d && d.percentil !== null && d.percentil !== undefined ? d.percentil : null; };
  const media = (l) => { const v = l.filter(x => x !== null && x !== undefined); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const rasgos = [
    ["Creación", media([p("AS")]), "Generar juego para las demás"],
    ["Anotación", media([p("PTS")]), "Producir puntos"],
    ["Exterior", media([p("3P%")]), "Amenaza desde el triple"],
    ["Rebote", media([p("REB")]), "Capturar rebotes"],
    ["Defensa", media([p("ROB"), extrasPct["TAP+"]]), "Presión y protección del aro"],
    ["Eficiencia", media([p("2P%"), p("3P%"), p("TL%"), p("VAL")]), "Rentabilidad de tus tiros y valoración"],
  ].filter(r => r[1] !== null);
  if (rasgos.length < 3) return;
  const N = rasgos.length, cx = 110, cy = 110, R = 72;
  const pt = (i, f) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * R * f, cy + Math.sin(a) * R * f]; };
  const poligono = (f) => rasgos.map((_, i) => pt(i, f).map(v => v.toFixed(1)).join(",")).join(" ");
  const tuyo = rasgos.map((r, i) => pt(i, r[1] / 100).map(v => v.toFixed(1)).join(",")).join(" ");
  const radar = `<svg viewBox="0 0 220 220" style="width:100%;max-width:260px;display:block;margin:0 auto;">
    ${[0.25, 0.5, 0.75, 1].map(f => `<polygon points="${poligono(f)}" fill="none" stroke="#d9c9b0" stroke-width="1"></polygon>`).join("")}
    ${rasgos.map((_, i) => { const [x, y] = pt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5d8c4"></line>`; }).join("")}
    <polygon points="${tuyo}" fill="rgba(224,96,42,.35)" stroke="#e0602a" stroke-width="2.5"></polygon>
    ${rasgos.map((r, i) => { const [x, y] = pt(i, 1.2); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#3a2d20">${esc(r[0])}</text>`; }).join("")}</svg>`;
  const ord = [...rasgos].sort((a, b) => b[1] - a[1]);
  const flojo = ord[ord.length - 1];
  destino.innerHTML = `<div class="bloque"><h3>Tu ADN de jugadora</h3>
    ${radar}
    <div style="margin-top:8px;">${rasgos.map(r => `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--wood-line);">
      <div style="flex:1;"><b>${esc(r[0])}</b><div style="font-size:11.5px;color:var(--ink-soft);">${esc(r[2])}</div></div>
      <div style="width:70px;height:7px;background:var(--wood-line);border-radius:4px;overflow:hidden;"><div style="width:${r[1]}%;height:100%;background:${nivelPct(r[1])};"></div></div>
      <b style="width:28px;text-align:right;color:${nivelPct(r[1])};">${r[1]}</b></div>`).join("")}</div>
    <p class="expl" style="margin-top:8px;">Destacas en <b>${esc(ord.slice(0, 2).map(r => r[0].toLowerCase()).join(" y "))}</b>${flojo[1] <= 40 ? `; donde más puedes crecer es en <b>${esc(flojo[0].toLowerCase())}</b>` : ""}.
      Cada rasgo va de 0 a 100: es tu posición frente a las jugadoras de tu grupo.</p></div>`;
}

async function pintarEvolucion(destino, nombre, equipo) {
  // 1) cual es la columna del jugador (Google pide letras de columna, no nombres)
  const cab = await leerPestana("Partidos_Estadisticas", "select * limit 1");
  if (!cab || !cab.cols) return;
  const iJ = cab.cols.indexOf("Jugador");
  if (iJ < 0) return;
  const palabras = limpiarNombre(nombre).replace(/[.,]/g, " ").split(/\s+/).filter(w => w.length > 2).sort((a, b) => b.length - a.length);
  if (!palabras.length) return;
  const clave = palabras[0].toLowerCase().replace(/'/g, "");
  const [datos, res] = await Promise.all([
    leerPestana("Partidos_Estadisticas", `select * where lower(${cab.ids[iJ]}) contains '${clave}'`),
    leerPestana("Resultados"),
  ]);
  if (!datos || !datos.filas.length) return;
  const meta = {};
  ((res && res.filas) || []).forEach(r => { if (r.PartidoID) meta[String(r.PartidoID).trim()] = r; });
  const mia = claveNombre(nombre);
  const vistos = new Set();
  const ps = datos.filas.filter(f => {
    const n = f.Jugador; if (!n || n === "TOTAL") return false;
    if (!(claveNombre(n) === mia || mismoNombre(n, nombre))) return false;
    const pid = String(f.PartidoID || "").trim(); if (!pid || vistos.has(pid)) return false;
    vistos.add(pid); return true;
  }).map(f => {
    const m = meta[String(f.PartidoID).trim()] || {};
    const casa = m.Local ? limpiarNombre(m.Local) === limpiarNombre(f.Equipo || equipo) : null;
    return { fecha: m.Fecha || "", jornada: m.Jornada || "", casa, rival: casa === null ? "" : (casa ? m.Visitante : m.Local),
      min: minutosDe(f.MIN), pt: num0(f.PT), va: num0(f.VA), reb: num0(f.REB_T), as: num0(f.AS), bp: num0(f.BP), mm: num0(f.MAS_MENOS),
      tc: parTiro(f.TC), t3: parTiro(f.T3), tl: parTiro(f.TL) };
  }).sort((a, b) => fechaOrd(a.fecha) - fechaOrd(b.fecha));
  if (!ps.length) return;

  const med = (f) => ps.reduce((a, x) => a + f(x), 0) / ps.length;
  const ult = ps.slice(-5);
  const m5 = ult.reduce((a, x) => a + x.pt, 0) / ult.length, mPt = med(x => x.pt);
  const dif = Math.round((m5 - mPt) * 10) / 10;
  const mejor = [...ps].sort((a, b) => b.va - a.va)[0];
  // grafico: barras de puntos + linea de valoracion
  const W = 340, H = 150, base = 128, top = 14, ancho = (W - 20) / ps.length;
  const maxV = Math.max(...ps.map(x => Math.max(x.pt, x.va)), 10);
  const Y = (v) => base - (Math.max(v, 0) / maxV) * (base - top);
  const barras = ps.map((x, i) => `<rect x="${(10 + i * ancho + ancho * 0.18).toFixed(1)}" y="${Y(x.pt).toFixed(1)}" width="${(ancho * 0.64).toFixed(1)}" height="${(base - Y(x.pt)).toFixed(1)}" rx="2" fill="#e0602a"></rect>`).join("");
  const linea = ps.map((x, i) => `${(10 + i * ancho + ancho / 2).toFixed(1)},${Y(x.va).toFixed(1)}`).join(" ");
  const puntos = ps.map((x, i) => `<circle cx="${(10 + i * ancho + ancho / 2).toFixed(1)}" cy="${Y(x.va).toFixed(1)}" r="2.8" fill="#1f7a5a"></circle>`).join("");
  const etiq = ps.map((x, i) => (ps.length <= 14 || i % 2 === 0) ? `<text x="${(10 + i * ancho + ancho / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#6b5f50">J${i + 1}</text>` : "").join("");
  const grafico = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;"><line x1="10" y1="${base}" x2="${W - 10}" y2="${base}" stroke="#d9c9b0"></line>
    ${barras}<polyline points="${linea}" fill="none" stroke="#1f7a5a" stroke-width="2.2"></polyline>${puntos}${etiq}</svg>`;
  const kpi = (t, v, s) => `<div style="flex:1;min-width:76px;background:var(--suave);border:1.5px solid var(--wood-line);border-radius:10px;padding:8px;text-align:center;">
    <b style="font-size:19px;display:block;">${v}</b><span style="font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--ink-soft);">${t}</span>
    ${s ? `<div style="font-size:11px;color:var(--ink-soft);">${s}</div>` : ""}</div>`;
  const filas = [...ps].reverse().slice(0, 10).map(x => `<tr><td style="text-align:left;white-space:nowrap;">${x.casa === null ? "" : (x.casa ? "vs " : "@ ")}${esc(x.rival || x.fecha || "")}</td>
    <td>${conComa(x.min, 0)}</td><td><b>${conComa(x.pt, 0)}</b></td><td>${x.tc.a}/${x.tc.i}</td><td>${x.t3.a}/${x.t3.i}</td><td>${x.tl.a}/${x.tl.i}</td>
    <td>${conComa(x.reb, 0)}</td><td>${conComa(x.as, 0)}</td><td>${conComa(x.bp, 0)}</td>
    <td style="color:${x.mm > 0 ? "#1f7a5a" : x.mm < 0 ? "#c75028" : "inherit"};">${x.mm > 0 ? "+" : ""}${conComa(x.mm, 0)}</td><td>${conComa(x.va, 0)}</td></tr>`).join("");
  destino.innerHTML = `<div class="bloque"><h3>Tu evolución por jornada</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      ${kpi("Partidos", ps.length, conComa(med(x => x.min), 0) + " min de media")}
      ${kpi("Puntos", conComa(mPt, 1), "por partido")}
      ${kpi("Valoración", conComa(med(x => x.va), 1), "por partido")}
      ${kpi("Últimos 5", conComa(m5, 1), dif > 0 ? "+" + conComa(dif, 1) + " sobre tu media" : (dif < 0 ? conComa(dif, 1) + " sobre tu media" : "igual que tu media"))}</div>
    ${grafico}
    <p class="expl" style="margin-top:4px;"><span style="color:#e0602a;font-weight:800;">■</span> Puntos · <span style="color:#1f7a5a;font-weight:800;">●</span> Valoración, partido a partido.
      ${mejor ? `Tu mejor partido: ${mejor.casa === null ? "" : (mejor.casa ? "vs " : "@ ")}${esc(mejor.rival || mejor.fecha)}, ${conComa(mejor.pt, 0)} puntos y ${conComa(mejor.va, 0)} de valoración.` : ""}</p>
    <div style="overflow-x:auto;margin-top:8px;"><table class="sj-zonas" style="min-width:420px;"><thead><tr><th style="text-align:left;">Rival</th><th>Min</th><th>PT</th><th>TC</th><th>T3</th><th>TL</th><th>REB</th><th>AS</th><th>BP</th><th>+/-</th><th>VAL</th></tr></thead><tbody>${filas}</tbody></table></div>
    ${ps.length > 10 ? `<p class="expl">Se muestran los 10 más recientes de ${ps.length}.</p>` : ""}</div>`;
}

async function pintarAnalisis(caja, nombre, equipo, encontrado, tiros, extras) {
  caja.insertAdjacentHTML("beforeend", `<div id="anEvo"></div><div id="anImp"></div><div id="anAdn"></div>`);
  // percentil de sus tapones dentro de su grupo (para el ADN)
  const extrasPct = {};
  try {
    const i = EXTRAS_TABS.findIndex(t => t[1] === "TAP+");
    const tab = extras[i], mia = claveNombre(nombre);
    const f = tab && tab.filas ? tab.filas.find(x => claveNombre(x.Jugador || x.Jugadora) === mia) : null;
    if (f) {
      const v = numero(f.Med !== undefined ? f.Med : f.Media);
      const g = (f.Grupo || "").trim();
      const vals = tab.filas.filter(x => !g || (x.Grupo || "").trim() === g).map(x => numero(x.Med !== undefined ? x.Med : x.Media)).filter(x => x !== null);
      if (v !== null && vals.length >= 8) extrasPct["TAP+"] = Math.round(vals.filter(x => x < v).length / vals.length * 100);
    }
  } catch (e) { /* sin tapones */ }
  try { pintarImpacto($("anImp"), encontrado, tiros); } catch (e) { /* nada */ }
  try { pintarAdn($("anAdn"), encontrado, extrasPct); } catch (e) { /* nada */ }
  try { await pintarEvolucion($("anEvo"), nombre, equipo); } catch (e) { /* nada */ }
}

async function pintarExtrasNumeros(caja, mia, equipo, encontrado) {
  try {
    const [extras, resumen] = await Promise.all([
      Promise.all(EXTRAS_TABS.map(t => leerPestana(t[0]))),
      leerPestana("Jugadoras_Tiros"),
    ]);
    const mio = (t) => t && t.filas ? t.filas.find(f => claveNombre(f.Jugador || f.Jugadora) === mia) : null;
    const cajas = [];
    encontrado.forEach(d => cajas.push([d.corta, conComa(d.valor, 1) + (d.pct ? "%" : "")]));
    EXTRAS_TABS.forEach((t, i) => {
      const f = mio(extras[i]); if (!f) return;
      const v = numero(f.Med !== undefined ? f.Med : f.Media);
      if (v !== null) cajas.push([t[1], conComa(v, 1)]);
    });
    const r = mio(resumen);
    if (r) {
      const n = (c) => numero(r[c]) || 0;
      const t2a = n("T2A"), t2i = n("T2I"), t3a = n("T3A"), t3i = n("T3I"), tla = n("TLA"), tli = n("TLI");
      const par = (a, i) => `${a}/${i}` + (i ? ` · ${conComa(a / i * 100, 1)}%` : "");
      if (t2i) cajas.push(["T2", par(t2a, t2i)]);
      if (t3i) cajas.push(["T3", par(t3a, t3i)]);
      if (t2i + t3i) {
        cajas.push(["TC", par(t2a + t3a, t2i + t3i)]);
        cajas.push(["eFG%", conComa((t2a + 1.5 * t3a) / (t2i + t3i) * 100, 1)]);
      }
      if (tli) cajas.push(["TL", par(tla, tli)]);
      if (t2i + t3i + tli) cajas.push(["TS%", conComa((t2a * 2 + t3a * 3 + tla) / (2 * (t2i + t3i + 0.44 * tli)) * 100, 1)]);
      const pj = n("Partidos"), per = n("Perdidas");
      if (pj && r.Perdidas !== undefined && r.Perdidas !== "") cajas.push(["PER", conComa(per / pj, 1)]);
    }
    if (cajas.length) caja.insertAdjacentHTML("beforeend", `<div class="bloque"><h3>Todas tus estadísticas</h3>
      <div class="sj-grid" style="grid-template-columns:repeat(auto-fill,minmax(92px,1fr));">
      ${cajas.map(c => `<div><b>${esc(c[1])}</b><i>${esc(c[0])}</i></div>`).join("")}</div></div>`);

    await pintarAnalisis(caja, jugadora.nombre, equipo, encontrado, r, extras);

    // Mapa de tiro: solo se piden los tiros de su equipo
    if (!equipo) return;
    const seguro = String(equipo).replace(/'/g, "");
    const datos = await leerPestana("Tiros", `select * where B = '${seguro}'`);
    if (!datos || !datos.filas.length) return;
    const tiros = datos.filas.filter(f => mismoNombre(f.Jugadora, jugadora.nombre)).map(tiroMetros).filter(Boolean);
    if (tiros.length < 3) return;
    const dentro = tiros.filter(t => t.anotado).length;
    const id = "mapaMio";
    caja.insertAdjacentHTML("beforeend", `<div class="bloque"><h3>Tu mapa de tiro</h3>
      <p class="expl">${tiros.length} tiros de campo · ${conComa(dentro / tiros.length * 100, 1)}% de acierto.
      Verde: buen porcentaje; naranja: medio; rojo: a mejorar. Los libres no tienen posición.</p>
      <div class="subnav" style="margin:0 0 10px;"><button class="active" data-m="zonas">Por zonas</button><button data-m="puntos">Tiro a tiro</button></div>
      <div id="${id}">${pistaSvg(tiros, "zonas")}</div>${tablaZonasHtml(zonasDeTiros(tiros))}</div>`);
    const bl = caja.querySelectorAll(".bloque");
    const ult = bl[bl.length - 1];
    ult.querySelectorAll(".subnav button").forEach(b => b.addEventListener("click", () => {
      ult.querySelectorAll(".subnav button").forEach(x => x.classList.toggle("active", x === b));
      ult.querySelector("#" + id).innerHTML = pistaSvg(tiros, b.getAttribute("data-m"));
    }));
  } catch (e) { /* los numeros de arriba ya estan; esto es un extra */ }
}

async function cargarNumeros() {
  const caja = $("tab-numeros");

  // El entrenador puede apagar las estadisticas de una jugadora
  if (jugadora.ver_numeros === false) {
    caja.innerHTML = `<div class="vacio">Aqui apareceran las cosas que te mande
      el entrenador. Mira las pestañas de <b>Mensajes</b> y <b>Videos</b>.</div>`;
    const [plant, rank] = await Promise.all([leerPestana("Plantillas"), leerPestana("Jugadoras")]);
    const mia2 = claveNombre(jugadora.nombre);
    let f = (plant && plant.filas.length) ? plant.filas.find(x => claveNombre(x.Jugadora) === mia2) : null;
    if (!f && rank && rank.filas.length) f = rank.filas.find(x => claveNombre(x.Jugador) === mia2);
    if (f) pintarCabecera(f.FotoURL || "");
    return;
  }

  const mia = claveNombre(jugadora.nombre);

  const tabs = await Promise.all(
    [leerPestana("Plantillas")].concat(CATEGORIAS.map(c => leerPestana(c.tab)))
  );
  const plantillas = tabs[0];

  // Foto y ficha oficial
  let foto = "", ficha = null;
  if (plantillas && plantillas.filas.length) {
    ficha = plantillas.filas.find(f => claveNombre(f.Jugadora) === mia);
    if (ficha) foto = ficha.FotoURL || "";
  }
  // Si no esta en las plantillas, su foto tambien viene en los rankings
  if (!foto) {
    for (let k = 1; k < tabs.length && !foto; k++) {
      const t = tabs[k];
      if (!t || !t.filas.length) continue;
      const f = t.filas.find(x => claveNombre(x.Jugador || x.Jugadora) === mia);
      if (f && f.FotoURL) foto = f.FotoURL;
    }
  }
  pintarCabecera(foto);

  // Su fila en cada ranking, con su percentil dentro de su grupo
  const encontrado = [];
  let equipoMio = (ficha && ficha.Equipo) ? ficha.Equipo : "";
  CATEGORIAS.forEach((c, i) => {
    const datos = tabs[i + 1];
    if (!datos || !datos.filas.length) return;
    const fila = datos.filas.find(f => claveNombre(f.Jugador || f.Jugadora) === mia);
    if (!fila) return;
    if (!equipoMio && fila.Equipo) equipoMio = fila.Equipo;
    const valor = numero(fila.Med !== undefined ? fila.Med : fila.Media);
    if (valor === null) return;

    const grupo = (fila.Grupo || "").trim();
    const rivales = datos.filas.filter(f => !grupo || (f.Grupo || "").trim() === grupo);
    const valores = rivales.map(f => numero(f.Med !== undefined ? f.Med : f.Media))
      .filter(v => v !== null);
    const pordebajo = valores.filter(v => v < valor).length;
    const puesto = valores.filter(v => v > valor).length + 1;

    encontrado.push({
      et: c.et, corta: c.corta, pct: c.pct, valor,
      partidos: numero(fila.Part),
      total: numero(fila.Tot),
      percentil: valores.length >= 8 ? Math.round(pordebajo / valores.length * 100) : null,
      puesto, cuantas: valores.length, grupo,
    });
  });

  if (!encontrado.length) {
    const hayAlgo = tabs.slice(1).some(t => t && t.filas.length);
    caja.innerHTML = `<div class="vacio">${hayAlgo
      ? "Todavia no apareces en las estadisticas de la FEB.<br><br>Puede ser que aun no hayas jugado los minutos minimos que pide."
      : `La temporada ${esc(ETIQUETA_TEMPORADA[temporadaElegida] || temporadaElegida)} aun no ha empezado.<br><br>En cuanto se juegue la primera jornada veras aqui tus numeros y tu sitio en la liga.`}</div>`;

    // En vista previa (solo el entrenador) se explica POR QUE no salen
    if (modoVistaPrevia) {
      const base = tabs[1] && tabs[1].filas.length ? tabs[1] : tabs.slice(1).find(t => t && t.filas.length);
      let pistas = "";
      if (base) {
        const trozos = limpiarNombre(jugadora.nombre).split(/\s+/).filter(x => x.length > 3);
        const parecidos = base.filas
          .map(f => f.Jugador || f.Jugadora || "")
          .filter(n => trozos.some(t => limpiarNombre(n).includes(t)))
          .slice(0, 5);
        pistas = parecidos.length
          ? `<p><b>Nombres parecidos en la FEB:</b></p><ul>${parecidos.map(n =>
              `<li>${esc(n)}</li>`).join("")}</ul><p>Si alguno es ella, copia ese nombre
              tal cual en su ficha del panel.</p>`
          : `<p>No hay ningun nombre parecido en la tabla de la FEB (${base.filas.length} jugadoras).
              O no jugo esta temporada, o esta en otro grupo.</p>`;
      } else {
        pistas = `<p>Las tablas de estadisticas de esta temporada estan vacias en el Google Sheet.
          Cambia la temporada en tu panel o espera a que se juegue la primera jornada.</p>`;
      }
      caja.insertAdjacentHTML("beforeend", `<div class="diag-previa">
        <b>Solo lo ves tu (vista previa)</b>
        <p>Buscando: <code>${esc(jugadora.nombre)}</code> &middot; temporada
          ${esc(ETIQUETA_TEMPORADA[temporadaElegida] || temporadaElegida)}</p>
        ${pistas}</div>`);
    }
    return;
  }

  // Tarjetas con sus medias
  let html = `<div class="rejilla">`;
  encontrado.slice(0, 6).forEach(d => {
    html += `<div class="dato">
      <div class="v">${conComa(d.valor, d.pct ? 1 : 1)}${d.pct ? "%" : ""}</div>
      <div class="l">${esc(d.et)}</div></div>`;
  });
  html += `</div>`;

  const pj = encontrado.map(d => d.partidos).filter(v => v)[0];
  const grupo = encontrado.map(d => d.grupo).filter(Boolean)[0];
  const et = ETIQUETA_TEMPORADA[temporadaElegida] || temporadaElegida;
  if (pj) {
    html += `<p class="expl" style="margin:-6px 0 14px;text-align:center;">
      Temporada ${esc(et)} &middot; medias por partido en ${conComa(pj, 0)} partidos${grupo ? " · grupo " + esc(grupo) : ""}.</p>`;
  }

  // Barras de percentil (el entrenador puede apagarlas)
  let barras = "";
  if (jugadora.ver_percentiles !== false) encontrado.forEach(d => {
    if (d.percentil === null) return;
    const clase = d.percentil >= 70 ? "alto" : (d.percentil <= 30 ? "bajo" : "");
    barras += `<div class="barra">
      <div class="arriba"><span>${esc(d.et)}</span>
        <b>${conComa(d.valor, 1)}${d.pct ? "%" : ""}</b></div>
      <div class="pista"><div class="relleno ${clase}" style="width:${Math.max(3, d.percentil)}%"></div></div>
      <div class="pie-barra">Mejor que el ${d.percentil}% · puesto ${d.puesto} de ${d.cuantas}</div>
    </div>`;
  });
  if (barras) {
    html += `<div class="bloque"><h3>Tu sitio en la liga</h3>
      <p class="expl">Cuanto mas llena la barra, mejor estas en esa faceta comparada
      con las demas jugadoras${grupo ? " de tu grupo" : ""}.</p>${barras}</div>`;
  }

  // Ficha oficial de la FEB
  if (ficha) {
    const datos = [["Puesto", ficha.Puesto], ["Altura", ficha.Altura],
                   ["Edad", ficha.Edad ? ficha.Edad + " anos" : ""],
                   ["Nacionalidad", ficha.Nacionalidad]].filter(d => d[1]);
    if (datos.length) {
      html += `<div class="bloque"><h3>Tu ficha en la FEB</h3>
        <div class="rejilla" style="margin:10px 0 0;">
        ${datos.map(d => `<div class="dato"><div class="v" style="font-size:16px;">${esc(d[1])}</div>
          <div class="l">${esc(d[0])}</div></div>`).join("")}</div></div>`;
    }
  }

  caja.innerHTML = html;
  pintarExtrasNumeros(caja, mia, equipoMio, encontrado);
}

async function cargarMensajes() {

async function marcarLeidos() {
  if (!sb || !jugadora) return;
  if (modoVistaPrevia) return;      // mirar no es leer: se deja tal cual
  const ahora = new Date().toISOString();
  await sb.from("mensajes").update({ leido_el: ahora })
    .eq("jugadora_id", jugadora.id).is("leido_el", null);
  $("puntoMensajes").hidden = true;
  document.querySelectorAll("#tab-mensajes .mensaje.nuevo").forEach(n => {
    n.classList.remove("nuevo");
    const et = n.querySelector(".etiqueta-nuevo");
    if (et) et.remove();
  });
}

/* ---------- Pestana 4: el scouting del rival ---------- */
/* ---------- Reproductor compartido (Videos y El rival) ---------- */
function incrustar(url) {
  const u = String(url || "").trim();
  let m = u.match(/(?:youtube\.com\/.*[?&]v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/i);
  if (m) return { tipo: "iframe", src: `https://www.youtube-nocookie.com/embed/${m[1]}` };
  m = u.match(/vimeo\.com\/(\d+)/i);
  if (m) return { tipo: "iframe", src: `https://player.vimeo.com/video/${m[1]}` };
  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i);
  if (m) return { tipo: "iframe", src: `https://drive.google.com/file/d/${m[1]}/preview` };
  if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)) return { tipo: "video", src: u };
  return { tipo: "fuera", src: u };
}

function marcoVideo(url, segundos) {
  const e = incrustar(url);
  const seg = Number(segundos) || 0;
  if (e.tipo === "iframe") {
    const t = seg ? (e.src.includes("vimeo") ? "#t=" + seg + "s" : "?start=" + seg) : "";
    return `<div class="marco"><iframe src="${esc(e.src + t)}" loading="lazy"
      allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
  }
  if (e.tipo === "video") {
    return `<div class="marco"><video src="${esc(e.src + (seg ? "#t=" + seg : ""))}"
      controls playsinline preload="metadata"></video></div>`;
  }
  return `<div class="fuera"><a class="boton" style="display:inline-block;width:auto;padding:12px 20px;
    text-decoration:none;" href="${esc(e.src)}" target="_blank" rel="noopener">Abrir el video</a></div>`;
}

function marcoJugada(url) {
  if (/thehoopsgeek\.com/i.test(String(url || ""))) {
    return `<div class="fuera" style="background:#fff3e8;">
      <b style="display:block;margin-bottom:4px;">Jugada en movimiento</b>
      <a class="boton" style="display:block;width:auto;padding:13px 20px;text-decoration:none;margin:8px 0;"
         href="${esc(url)}" target="_blank" rel="noopener">▶ Ver la jugada animada</a>
      <button type="button" data-visor-frame="${esc(url)}" style="border:0;background:var(--ink);color:#fff;font:inherit;font-size:14px;padding:11px 18px;border-radius:9px;cursor:pointer;width:100%;">Verla aquí en grande</button>
    </div>`;
  }
  return marcoVideo(url, 0);
}


/* ---------- Visor a pantalla completa (pizarras y jugadas animadas) ---------- */
function cerrarVisor() { const v = document.getElementById("visor"); if (v) v.remove(); document.body.style.overflow = ""; }
function abrirVisor(tipo, src) {
  cerrarVisor();
  const cuerpo = tipo === "img"
    ? `<div style="flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;background:#fff;">
         <img src="${esc(src)}" alt="Pizarra" style="max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom pan-x pan-y;"></div>`
    : `<iframe src="${esc(src)}" allowfullscreen allow="autoplay; fullscreen" style="flex:1;width:100%;border:0;background:#fff;"></iframe>`;
  document.body.insertAdjacentHTML("beforeend", `<div id="visor" style="position:fixed;inset:0;z-index:9999;background:#111;display:flex;flex-direction:column;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);">
    <div style="display:flex;gap:10px;align-items:center;padding:10px 12px;">
      <button type="button" id="visorCerrar" style="border:0;background:#fff;color:#111;font:inherit;font-weight:700;padding:10px 16px;border-radius:9px;">✕ Cerrar</button>
      ${tipo === "frame" ? `<a href="${esc(src)}" target="_blank" rel="noopener" style="color:#fff;font-size:14px;margin-left:auto;">Abrir fuera de la app</a>` : `<span style="color:#ccc;font-size:13px;margin-left:auto;">Pellizca para ampliar</span>`}
    </div>${cuerpo}</div>`);
  document.body.style.overflow = "hidden";
  document.getElementById("visorCerrar").addEventListener("click", cerrarVisor);
}
document.addEventListener("click", (e) => {
  const i = e.target.closest && e.target.closest("[data-visor-img]");
  if (i) { e.preventDefault(); abrirVisor("img", i.getAttribute("src")); return; }
  const f = e.target.closest && e.target.closest("[data-visor-frame]");
  if (f) { e.preventDefault(); abrirVisor("frame", f.getAttribute("data-visor-frame")); }
});

function extrasJugadoraHtml(j) {
  const todas = (j.todas || []).length ? `<details class="sj-todas"><summary>Todas sus estadísticas</summary>
    <div class="sj-grid">${j.todas.map(d => `<div><b>${esc(d.v)}</b><i>${esc(d.et)}</i></div>`).join("")}</div></details>` : "";

}

      ${barra(sc.puntos, "De donde vienen sus puntos")}
      ${barra(sc.intentos, "Como reparten los tiros")}
      ${(sc.puntos || sc.intentos) ? `<div class="sr-leyenda">
        <span><i class="r2"></i>Dos</span><span><i class="r3"></i>Triple</span><span><i class="rt"></i>Tiro libre</span>

      ${sc.texto ? `<p style="margin-top:10px;">${esc(sc.texto)}</p>` : ""}
