  }

  if (sc.tipo === "mapa" && sc.mapa && String(sc.mapa.svg || "").startsWith("<svg")) {
    return `<div class="seccion-rival">${tit}
      <p style="margin-bottom:6px;">${esc(sc.mapa.tiros)} tiros de campo · ${esc(String(sc.mapa.pct).replace(".", ","))}% de acierto.
        Verde: buen porcentaje; naranja: medio; rojo: bajo.</p>
      <img class="sj-mapa" data-visor-img="1" alt="Mapa de tiro del equipo" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(sc.mapa.svg)}">
      ${tablaZonasHtml((sc.mapa.zonas || []).map(z => ({ zona: z.zona, a: z.a, i: z.i, pct: Number(z.pct), pps: Number(z.pps) })))}
      <p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Pts/tiro: puntos que da cada intento desde esa zona.</p></div>`;
  }

  if (sc.tipo === "plantilla" && (sc.jugadoras || []).length) {
    return `<div class="seccion-rival">${tit}
      <p style="color:var(--orange);font-weight:800;font-size:13.5px;margin:0 0 8px;">De cada jugadora: toca «Todas sus estadísticas» o «Mapa de tiro» para verlos.</p>${sc.jugadoras.map(p => {
      const ini = limpiarNombre(p.nombre).replace(/[^A-Z ]/g, "").trim().slice(0, 2);
      return `<div class="sr-plant"><div class="sr-plant-cab">
        ${p.foto ? `<img src="${esc(p.foto)}" loading="lazy" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top center;flex:none;"
              onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sinfoto2',textContent:'${esc(ini)}'}))">`
               : `<div class="sinfoto2" style="width:40px;height:40px;border-radius:50%;background:var(--wood-line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;">${esc(ini)}</div>`}
        <div class="sj-info"><b>${p.dorsal ? `<span class="dor">${esc(p.dorsal)}</span>` : ""}${esc(p.nombre)}</b>
          ${p.puesto ? `<div class="sj-puesto">${esc(p.puesto)}</div>` : ""}
          <div class="sj-datos">${(p.datos || []).map(d => `<span><i>${esc(d.et)}</i>${esc(d.v)}</span>`).join("")}</div></div></div>
        <div class="cuerpo">${p.nota ? `<div class="sj-nota">${esc(p.nota)}</div>` : ""}${extrasJugadoraHtml(p)}</div></div>`;
    }).join("")}</div>`;
  }

  if (sc.tipo === "jugadoras" && (sc.jugadoras || []).length) {
    return `<div class="seccion-rival">${tit}
      <div class="sr-jugs">${sc.jugadoras.map(j => {
        const ini = limpiarNombre(j.nombre).replace(/[^A-Z ]/g, "").trim().slice(0, 2);
        return `<div class="sr-jug">
          ${j.foto ? `<img src="${esc(j.foto)}" loading="lazy" alt=""
                onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sinfoto2',textContent:'${esc(ini)}'}))">`
                   : `<div class="sinfoto2">${esc(ini)}</div>`}
          <div class="sj-info">
            <b>${j.dorsal ? `<span class="dor">${esc(j.dorsal)}</span>` : ""}${esc(j.nombre)}</b>
            ${j.puesto ? `<div class="sj-puesto">${esc(j.puesto)}</div>` : ""}
            <div class="sj-datos">${(j.datos || []).map(d =>
              `<span><i>${esc(d.et)}</i>${esc(d.v)}</span>`).join("")}</div>
            ${extrasJugadoraHtml(j)}
            ${j.nota ? `<div class="sj-nota">${esc(j.nota)}</div>` : ""}
          </div>
        </div>`;
      }).join("")}</div></div>`;
  }

  if (sc.tipo === "videos" && (sc.videos || []).length) {
    return `<div class="seccion-rival">${tit}${sc.videos.map(v => `<div class="clip">${marcoVideo(v.url, v.segundos)}
      <div class="texto"><b>${esc(v.titulo || "Video")}</b>
      ${v.nota ? `<p>${esc(v.nota)}</p>` : ""}
      ${(v.etiquetas || []).length ? `<p>${v.etiquetas.map(x => "#" + esc(x)).join(" ")}</p>` : ""}</div></div>`).join("")}</div>`;
  }

  if (sc.tipo === "jugadas" && (sc.grupos || []).length) {
    return `<div class="seccion-rival">${tit}${sc.grupos.map(g => `<div class="sr-tit" style="margin-top:12px;color:var(--ink);">${esc(g.tipo)}</div>
      ${(g.jugadas || []).map(p => `<div class="clip">
        ${(p.imagenes || []).length ? `<div class="pizarras-mini">${p.imagenes.map(im => `<img src="${esc(im)}" data-visor-img="1" loading="lazy" alt="Pizarra">`).join("")}</div><div class="hint" style="padding:0 14px;font-size:12px;color:var(--ink-soft);">Toca una pizarra para verla en grande</div>` : ""}
        <div class="texto"><b>${esc(p.nombre)}</b>${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ""}</div>
        ${p.enlace ? marcoJugada(p.enlace) : ""}</div>`).join("")}`).join("")}</div>`;
  }

  if (sc.tipo === "mejores" && (sc.bloques || []).length) {
    return `<div class="seccion-rival">${tit}
      ${sc.bloques.map(b => `<div class="sr-mp">
        <div class="mp-tit">${esc(b.titulo)}</div>
        <div class="mp-cols">
          <div><span class="eti buena">Mejores</span>
            ${(b.mejores || []).map(x => `<div class="mp-fila"><span>${esc(x.j)}</span><b>${esc(x.v)}</b></div>`).join("")}</div>
          <div><span class="eti mala">Peores</span>
            ${(b.peores || []).map(x => `<div class="mp-fila"><span>${esc(x.j)}</span><b>${esc(x.v)}</b></div>`).join("")}</div>
        </div></div>`).join("")}</div>`;
  }

  return `<div class="seccion-rival">${tit}<p>${esc(sc.texto || "")}</p></div>`;
}

let ultimoInforme = "", ultimoEquipo = "";
const ES_EQUIPO = (i) => i.rival === "__MI_EQUIPO__";
let ordenApp = null;
async function leerOrdenApp() {
  try {
    const { data } = await sb.from("ajustes").select("valor").eq("clave", "orden_app").limit(1);
    if (data && data.length && data[0].valor) ordenApp = JSON.parse(data[0].valor);
  } catch (e) { ordenApp = null; }
}
const ordenSecciones = (lista) => {
  const o = (ordenApp && ordenApp.secciones) || [];
  const pos = (sc) => { const k = o.indexOf(sc.tipo || "texto"); return k < 0 ? 999 : k; };
  return [...(lista || [])].map((x, n) => [x, n]).sort((a, b) => pos(a[0]) - pos(b[0]) || a[1] - b[1]).map(x => x[0]);
};
function aplicarOrdenPestanas() {
  if (!ordenApp || !ordenApp.pestanas) return;
  const barra = document.querySelector(".pestanas");
  if (!barra || barra.hidden) return;
  const botones = [...barra.querySelectorAll("button[data-tab]")];
  const ocultas = ordenApp.ocultas || [];
  ordenApp.pestanas.forEach(id => {
    const b = botones.find(x => x.getAttribute("data-tab") === id);
    if (b) barra.appendChild(b);
  });
  botones.forEach(b => { b.hidden = ocultas.includes(b.getAttribute("data-tab")); });
  const primera = [...barra.querySelectorAll("button[data-tab]")].find(b => !b.hidden);
  if (primera && !primera.classList.contains("activa") && !barra.dataset.ordenado) primera.click();
  barra.dataset.ordenado = "1";
}
async function cargarInformes() {
  await leerOrdenApp();
  aplicarOrdenPestanas();
  const caja = $("tab-rival"), cajaEq = $("tab-equipo");
  const { data, error } = await sb.from("informes")
    .select("*").order("fecha", { ascending: false });
  if (error) { caja.innerHTML = `<div class="vacio">${esc(error.message)}</div>`; return; }
  const todos = data || [];
  const rivales = todos.filter(i => !ES_EQUIPO(i)), propios = todos.filter(ES_EQUIPO);
  const reciente = (i) => { const t = new Date(i.fecha).getTime(); return !isNaN(t) && Date.now() - t < 7 * 24 * 3600 * 1000; };
  const visto = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  if (!rivales.length) {
    caja.innerHTML = `<div class="vacio">Cuando el entrenador mande el scouting
      de un rival, lo veras aqui.</div>`;
  } else {
    ultimoInforme = rivales[0].id;
    if (reciente(rivales[0]) && visto("lf2_rival_visto") !== rivales[0].id) $("puntoRival").hidden = false;
    caja.innerHTML = rivales.map(i => `
      <div class="bloque">
        <h3>${esc(i.titulo)}</h3>
        <p class="expl">${esc(i.partido || "")}${i.partido ? " · " : ""}${esc(fechaCorta(i.fecha))}</p>
        ${ordenSecciones(i.secciones).map(seccionRivalHtml).join("")}
      </div>`).join("");
  }

  if (!propios.length) {
    cajaEq.innerHTML = `<div class="vacio">Cuando el entrenador mande el playbook y las
      estadisticas del equipo, los veras aqui.</div>`;
  } else {
    ultimoEquipo = propios[0].id;
    if (reciente(propios[0]) && visto("lf2_equipo_visto") !== propios[0].id) $("puntoEquipo").hidden = false;
    cajaEq.innerHTML = propios.map(i => `
      <div class="bloque">
        <h3>${esc(i.titulo)}</h3>
        <p class="expl">${esc(i.partido || "")}${i.partido ? " · " : ""}${esc(fechaCorta(i.fecha))}</p>
        ${ordenSecciones(i.secciones).map(seccionRivalHtml).join("")}
      </div>`).join("");
  }
}

async function cargarClips() {
  const caja = $("tab-clips");
  const { data, error } = await sb.from("clips")
    .select("*").eq("jugadora_id", jugadora.id).order("fecha", { ascending: false });
  if (error) { caja.innerHTML = `<div class="vacio">${esc(error.message)}</div>`; return; }

  const lista = data || [];
  if (!lista.length) {
    caja.innerHTML = `<div class="vacio">Todavia no tienes videos.</div>`;
    return;
  }
  caja.innerHTML = lista.map(c => `<div class="clip">${marcoVideo(c.url, c.segundos)}
    <div class="texto"><b>${esc(c.titulo || "Video")}</b>
    ${c.nota ? `<p>${esc(c.nota)}</p>` : ""}</div></div>`).join("");
}

/* ============================================================
   PESTANAS
   ============================================================ */
document.querySelectorAll(".pestanas button").forEach(b => {
  b.addEventListener("click", () => {
    const t = b.getAttribute("data-tab");
    document.querySelectorAll(".pestanas button").forEach(x => x.classList.toggle("activa", x === b));
    ["numeros", "mensajes", "clips", "rival", "equipo"].forEach(n => { $("tab-" + n).hidden = (n !== t); });
    if (t === "mensajes") marcarLeidos();
    if (t === "rival") {
      $("puntoRival").hidden = true;
      try { localStorage.setItem("lf2_rival_visto", ultimoInforme || ""); }
      catch (e) { /* nada */ }
    }
    if (t === "equipo") {
      $("puntoEquipo").hidden = true;
      try { localStorage.setItem("lf2_equipo_visto", ultimoEquipo || ""); }
      catch (e) { /* nada */ }
    }
  });
});
$("btnEntrar").addEventListener("click", pedirAcceso);
$("correo").addEventListener("keydown", (e) => { if (e.key === "Enter") $("clave").focus(); });
$("clave").addEventListener("keydown", (e) => { if (e.key === "Enter") pedirAcceso(); });
$("clave2").addEventListener("keydown", (e) => { if (e.key === "Enter") pedirAcceso(); });
$("btnOlvide").addEventListener("click", olvideClave);
$("btnGuardarClave").addEventListener("click", guardarNuevaClave);
$("recordar").checked = recordarSesion();
$("verClave").addEventListener("click", () => {
  const ver = $("clave").type === "password";
  $("clave").type = ver ? "text" : "password"; $("clave2").type = ver ? "text" : "password";
  $("verClave").textContent = ver ? "Ocultar" : "Mostrar";
});
document.querySelectorAll("#accesoModos button").forEach(b => b.addEventListener("click", () => cambiarModoAcceso(b.getAttribute("data-modo"))));

/* ============================================================
   ARRANQUE
   ============================================================ */
let enRecuperacion = false;
function engancharSesion() {
  if (!sb) return;
  sb.auth.onAuthStateChange((evento, sesion) => {
    if (evento === "PASSWORD_RECOVERY") { enRecuperacion = true; mostrarNuevaClave(); return; }
    if (enRecuperacion) return;
    if (sesion && $("pantallaPerfil").hidden) cargarPerfil(sesion);
  });
}
(async function arrancar() {
  sb = arrancarSupabase();
  if (!sb) {
    avisar("avisoEntrar",
      "Falta configurar la clave de la app. Si eres el entrenador, pega la clave "
      + "anon public en el apartado CONFIG del archivo.", "mal");
    return;
  }
  if (/type=recovery/.test(location.hash)) { enRecuperacion = true; mostrarNuevaClave(); engancharSesion(); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) { cargarPerfil(data.session); return; }
  engancharSesion();
})();

/* Al imprimir se abren los desplegables (estadisticas, mapas) para que salgan en el PDF */
window.addEventListener("beforeprint", () => {
  document.querySelectorAll("details").forEach(d => { d.dataset.abiertoAntes = d.open ? "1" : "0"; d.open = true; });
});
window.addEventListener("afterprint", () => {
  document.querySelectorAll("details[data-abierto-antes]").forEach(d => { d.open = d.dataset.abiertoAntes === "1"; delete d.dataset.abiertoAntes; });
});
</script>
